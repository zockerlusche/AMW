<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13120e">
<title>AMW Workbench</title>
<style>
:root {
  --grund: #13120e; --flaeche: #1c1a15; --flaeche2: #24211b; --linie: #353026; --linie2: #4a4335;
  --tinte: #ece5d3; --leise: #a39a86; --sehrleise: #6f6858;
  --bernstein: #f0a93a; --bernstein-weich: rgba(240,169,58,.12);
  --gruen: #86b46f; --rot: #e5583a; --rot-weich: rgba(229,88,58,.14);
  --schatten: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 30px -18px rgba(0,0,0,.8);
  --titel: "Bahnschrift", "DIN Alternate", "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  --text: "Segoe UI Variable Text", "Segoe UI", "Source Sans 3", -apple-system, "Roboto", sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", "JetBrains Mono", "SF Mono", Consolas, monospace;
}
:root[data-thema="hell"] {
  --grund: #efe9da; --flaeche: #f8f4ea; --flaeche2: #f1ebdc; --linie: #d8cfba; --linie2: #c4b99f;
  --tinte: #211e17; --leise: #6b6250; --sehrleise: #9a907b;
  --bernstein: #b46d07; --bernstein-weich: rgba(180,109,7,.10);
  --gruen: #4c7d36; --rot: #b8381c; --rot-weich: rgba(184,56,28,.10);
  --schatten: 0 10px 24px -18px rgba(60,45,10,.45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--grund); color: var(--tinte); font: 14px/1.45 var(--text);
  background-image:
    repeating-linear-gradient(0deg, transparent 0 31px, rgba(255,255,255,.018) 31px 32px),
    radial-gradient(1200px 500px at 85% -10%, var(--bernstein-weich), transparent 60%);
}
:root[data-thema="hell"] body { background-image: repeating-linear-gradient(0deg, transparent 0 31px, rgba(0,0,0,.03) 31px 32px); }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: 12.5px; letter-spacing: -.01em; }
.leise { color: var(--leise); }
.sehrleise { color: var(--sehrleise); }

/* --- Rahmen ------------------------------------------------------------------------------- */
.rahmen { display: grid; grid-template-columns: 216px 1fr; grid-template-rows: 58px 1fr; height: 100vh; height: 100dvh; }
header {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding: 0 18px 0 0;
  border-bottom: 1px solid var(--linie); background: color-mix(in srgb, var(--grund) 85%, transparent);
  backdrop-filter: blur(6px); position: relative; z-index: 2;
}
.marke { width: 216px; height: 100%; display: flex; align-items: center; gap: 10px; padding-left: 18px; border-right: 1px solid var(--linie); flex: none; }
.marke b { font: 600 22px/1 var(--titel); letter-spacing: .14em; }
.marke span { font: 10.5px/1.15 var(--titel); letter-spacing: .05em; color: var(--leise); text-transform: uppercase; }
.signale { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.signal { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border: 1px solid var(--linie);
  border-radius: 3px; font: 12px var(--titel); letter-spacing: .05em; text-transform: uppercase; color: var(--leise); background: var(--flaeche); white-space: nowrap; }
.punkt { width: 8px; height: 8px; border-radius: 50%; background: var(--sehrleise); flex: none; }
.punkt.gruen { background: var(--gruen); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gruen) 20%, transparent); }
.punkt.bernstein { background: var(--bernstein); box-shadow: 0 0 0 3px var(--bernstein-weich); }
.punkt.rot { background: var(--rot); box-shadow: 0 0 0 3px var(--rot-weich); animation: puls 1.6s infinite; }
@keyframes puls { 50% { opacity: .35; } }
.suche { margin-left: auto; position: relative; }
.suche input { width: min(34vw, 380px); padding: 8px 12px 8px 30px; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 3px; outline: none; }
.suche input:focus { border-color: var(--bernstein); }
.suche::before { content: "⌕"; position: absolute; left: 10px; top: 6px; color: var(--sehrleise); font-size: 16px; }
.schalter-halt { font: 600 13px var(--titel); letter-spacing: .12em; text-transform: uppercase; padding: 9px 16px; border-radius: 3px;
  border: 1px solid var(--rot); background: transparent; color: var(--rot); cursor: pointer; flex: none; }
.schalter-halt:hover { background: var(--rot-weich); }
.schalter-halt.aktiv { background: var(--rot); color: #fff; }

nav { border-right: 1px solid var(--linie); padding: 14px 0; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
nav .gruppe { font: 11px var(--titel); letter-spacing: .14em; text-transform: uppercase; color: var(--sehrleise); padding: 14px 18px 6px; }
nav a { display: flex; align-items: baseline; gap: 10px; padding: 8px 18px; color: var(--leise); text-decoration: none; cursor: pointer;
  border-left: 3px solid transparent; font: 15px var(--titel); letter-spacing: .02em; }
nav a .sym { display: none; }
nav a:hover { color: var(--tinte); background: var(--flaeche); }
nav a.an { color: var(--tinte); border-left-color: var(--bernstein); background: linear-gradient(90deg, var(--bernstein-weich), transparent); }
nav a .zahl { margin-left: auto; font: 12px var(--mono); color: var(--sehrleise); }
nav a .zahl.heiss { color: #1b1408; background: var(--bernstein); padding: 0 7px; border-radius: 9px; font-weight: 600; }
nav .fuss { margin-top: auto; padding: 14px 18px; display: flex; gap: 8px; flex-wrap: wrap; }
.klein-knopf { font: 12px var(--titel); letter-spacing: .06em; text-transform: uppercase; padding: 6px 10px; border: 1px solid var(--linie2);
  background: transparent; border-radius: 3px; cursor: pointer; color: var(--leise); }
.klein-knopf:hover { color: var(--tinte); border-color: var(--leise); }

main { overflow-y: auto; padding: 26px 30px 60px; }
.kopf { display: flex; align-items: baseline; gap: 14px; margin: 0 0 18px; flex-wrap: wrap; }
h1 { font: 600 28px/1.1 var(--titel); letter-spacing: .03em; margin: 0; }
h2 { font: 600 13px var(--titel); letter-spacing: .16em; text-transform: uppercase; color: var(--leise); margin: 30px 0 12px;
  display: flex; align-items: center; gap: 10px; }
h2::after { content: ""; flex: 1; height: 1px; background: var(--linie); }
.zeile-reveal > * { animation: auf .45s cubic-bezier(.2,.7,.2,1) both; }
.zeile-reveal > *:nth-child(2) { animation-delay: .04s } .zeile-reveal > *:nth-child(3) { animation-delay: .08s }
.zeile-reveal > *:nth-child(4) { animation-delay: .12s } .zeile-reveal > *:nth-child(5) { animation-delay: .16s }
.zeile-reveal > *:nth-child(n+6) { animation-delay: .2s }
.still .zeile-reveal > * { animation: none; }
nav .fuss .version { width: 100%; font: 11px var(--mono); color: var(--sehrleise); letter-spacing: 0; }
.einst { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; max-width: 980px; }
.einst > * { min-width: 0; }   /* sonst zieht die breite Agenten-Tabelle alle Karten über den Handy-Rand */
.einst .karte { padding: 16px 18px; }
.einst h3 { font: 600 15px var(--titel); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 10px; }
.einst .feld { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 6px 14px; align-items: start; padding: 5px 0; }
.einst .feld > label { color: var(--leise); font-size: 13px; padding-top: 7px; }
.einst input:not([type=checkbox]), .einst select { width: 100%; max-width: 420px; padding: 7px 9px; background: var(--grund); color: var(--tinte);
  border: 1px solid var(--linie); border-radius: 3px; font: inherit; font-size: 14px; }
.einst input[type=checkbox] { width: 18px; height: 18px; margin-top: 8px; accent-color: var(--bernstein); }
.einst table.tab input:not([type=checkbox]), .einst table.tab select { min-width: 70px; }
.einst table.tab td { vertical-align: middle; }
.einst .gesperrt { opacity: .65; }
@keyframes auf { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* --- Bausteine ---------------------------------------------------------------------------- */
.karte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 4px; box-shadow: var(--schatten); }
.ref { font: 12.5px var(--mono); color: var(--bernstein); }
.etikett { display: inline-block; font: 11px var(--titel); letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px;
  border: 1px solid var(--linie2); border-radius: 2px; color: var(--leise); white-space: nowrap; }
.etikett.rot { border-color: var(--rot); color: var(--rot); }
.etikett.bernstein { border-color: var(--bernstein); color: var(--bernstein); }
.etikett.gruen { border-color: var(--gruen); color: var(--gruen); }
.leer { padding: 22px; color: var(--sehrleise); border: 1px dashed var(--linie); border-radius: 4px; text-align: center; }

.band-halt { display: flex; gap: 14px; align-items: center; padding: 14px 18px; border: 1px solid var(--rot); background: var(--rot-weich);
  border-radius: 4px; margin-bottom: 18px; flex-wrap: wrap; }
.band-halt b { font: 600 18px var(--titel); letter-spacing: .1em; color: var(--rot); }
.band-warn { display: grid; gap: 4px; padding: 12px 18px; border: 1px solid var(--bernstein); background: var(--bernstein-weich);
  border-radius: 4px; margin-bottom: 18px; }
.band-warn b { font: 600 14px var(--titel); letter-spacing: .1em; color: var(--bernstein); }
.kurztext { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.kurztext.auf { display: block; -webkit-line-clamp: unset; }
.mehr { font: 12px var(--titel); letter-spacing: .06em; color: var(--sehrleise); cursor: pointer; background: none; border: 0; padding: 4px 0 0; }
.nachtrag-neu { margin-left: 8px; }
/* Planung: senkrechte Zeitleiste */
.zeitleiste { position: relative; display: grid; gap: 14px; padding-left: 26px; margin-top: 8px; }
.zeitleiste::before { content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px; background: var(--linie2); }
.tl-heute { position: relative; margin: 2px 0 -4px -26px; display: flex; align-items: center; gap: 8px; }
.tl-heute::before { content: ""; width: 18px; height: 2px; background: var(--bernstein); }
.tl-heute span { font: 12px var(--titel); letter-spacing: .12em; text-transform: uppercase; color: var(--bernstein); }
.tl-heute::after { content: ""; flex: 1; height: 1px; background: color-mix(in srgb, var(--bernstein) 50%, transparent); }
.tl-bogen { position: relative; padding: 14px 16px; display: grid; gap: 6px; }
.tl-bogen.status-fertig { opacity: .75; } .tl-bogen.status-verworfen { opacity: .45; }
.tl-punkt { position: absolute; left: -24px; top: 18px; width: 12px; height: 12px; border-radius: 50%; background: var(--sehrleise); border: 2px solid var(--grund); }
.tl-punkt.gruen { background: var(--gruen); } .tl-punkt.bernstein { background: var(--bernstein); } .tl-punkt.rot { background: var(--rot); }
.tl-kopf { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tl-titel { font: 600 18px var(--titel); letter-spacing: .02em; }
.tl-knoepfe { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.tl-zeile { font-size: 14px; overflow-wrap: anywhere; }
.tl-fortschritt { display: grid; grid-template-columns: minmax(80px, 260px) auto; gap: 10px; align-items: center; }
.tl-daten { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13.5px; }
.tl-specs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spec-chip { font: 12px var(--titel); letter-spacing: .04em; padding: 3px 9px; border-radius: 12px; border: 1px solid var(--linie2); background: var(--grund); color: var(--leise); cursor: pointer; }
.spec-chip.spec-frei { border-color: var(--gruen); color: var(--gruen); }
.spec-chip.spec-vorgelegt { border-color: var(--bernstein); color: var(--bernstein); font-weight: 600; }
.spec-chip.spec-zurueck { border-color: var(--rot); color: var(--rot); }
.tl-schritte summary { cursor: pointer; font: 12px var(--titel); letter-spacing: .1em; text-transform: uppercase; color: var(--leise); margin-top: 4px; }
.welle { margin-top: 8px; } .welle-kopf { font: 11px var(--titel); letter-spacing: .12em; text-transform: uppercase; color: var(--sehrleise); margin-bottom: 4px; }
.schritt { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; padding: 6px 8px;
  border-left: 3px solid var(--linie2); background: var(--grund); border-radius: 3px; margin-bottom: 4px; font-size: 13.5px; }
.schritt.status-laeuft { border-left-color: var(--gruen); } .schritt.status-fertig { opacity: .6; } .schritt.status-blockiert { border-left-color: var(--rot); }
.schritt.mensch { border-left-color: var(--bernstein); background: var(--bernstein-weich); }
.schritt-titel { overflow-wrap: anywhere; } .schritt-meta { grid-column: 2 / 4; font-size: 12px; }
.spec-text { white-space: pre-wrap; font: 13.5px/1.5 var(--mono); background: var(--grund); border: 1px solid var(--linie); border-radius: 4px; padding: 12px; max-height: 50vh; overflow: auto; }
.verweis { cursor: pointer; color: var(--bernstein); border-bottom: 1px dotted currentColor; }
.check { display: grid; gap: 6px; } .check > div { padding: 6px 0; border-bottom: 1px solid var(--linie); font-size: 14px; }
.gruen-text { color: var(--gruen); }
.rm-huelle { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
.rm { display: grid; grid-template-columns: 18px auto; grid-template-rows: auto 18px; gap: 4px; }
.rm-y { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 11px; }
.rm-x { grid-column: 2; text-align: center; font-size: 11px; }
.rm-gitter { display: grid; grid-template-columns: 16px repeat(5, 38px); gap: 3px; }
.rm-zelle { height: 30px; border-radius: 3px; display: grid; place-items: center; font: 600 13px var(--mono); color: var(--tinte); }
.rm-gruen { background: color-mix(in srgb, var(--gruen) 25%, transparent); } .rm-gelb { background: color-mix(in srgb, var(--bernstein) 30%, transparent); }
.rm-rot { background: color-mix(in srgb, var(--rot) 35%, transparent); }
.rm-achse { font-size: 11px; display: grid; place-items: center; }
.risiko { padding: 10px 14px; cursor: pointer; } .risiko.status-erledigt { opacity: .55; }
/* Plan-Check: Befunde mit Bedeutung, Abhilfe, Wer; Gruppen je Bogen */
.check-kopf { display: grid; gap: 8px; margin-bottom: 14px; }
.check-kopf p { margin: 0; font-size: 14.5px; }
.check-zahlen { display: flex; gap: 8px; flex-wrap: wrap; }
.check-zahl { border: 1px solid var(--linie2); border-radius: 3px; padding: 4px 10px; font-size: 13.5px; }
.check-zahl b { font: 600 16px var(--titel); }
.check-zahl.fehler { border-color: var(--rot); } .check-zahl.fehler b { color: var(--rot); }
.check-zahl.warnung { border-color: var(--bernstein); } .check-zahl.warnung b { color: var(--bernstein); }
.check-legende { font-size: 13px; }
.check-gruppe { margin: 18px 0 6px; }
.check-gruppe h4 { margin: 0 0 8px; font: 600 13px var(--titel); letter-spacing: .1em; text-transform: uppercase; color: var(--leise); }
.check-gruppe h4 .verweis { text-transform: none; letter-spacing: 0; font: 13px var(--text); margin-left: 8px; }
.befund { border: 1px solid var(--linie); border-left: 3px solid var(--linie2); border-radius: 3px; padding: 10px 14px; display: grid; gap: 5px;
  background: var(--flaeche); margin-bottom: 8px; }
.befund-fehler { border-left-color: var(--rot); } .befund-warnung { border-left-color: var(--bernstein); }
.befund-kopf { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; } .befund-kopf b { font-size: 15px; overflow-wrap: anywhere; }
.befund-zeile { font-size: 14px; overflow-wrap: anywhere; }
.befund-zeile > .sehrleise:first-child { display: inline-block; min-width: 74px; }
.befund-knoepfe { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.befund-schluessel { font: 11.5px var(--mono); color: var(--sehrleise); margin-left: auto; }
.akzeptiert-zeile { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 8px 0; border-bottom: 1px solid var(--linie); font-size: 14px; }
.blink { animation: blink 1.6s ease-out; }
@keyframes blink { 0%, 30% { box-shadow: 0 0 0 2px var(--bernstein); } 100% { box-shadow: 0 0 0 2px transparent; } }
/* Übersicht über der Zeitleiste: echte Zeitachse, gepackt – Bögen ohne Überschneidung teilen sich eine Spur; Klick springt zum Bogen */
.ueb { border: 1px solid var(--linie); border-radius: 4px; background: var(--flaeche); padding: 12px 14px 10px; margin: 4px 0 14px; }
.ueb-kopf { display: flex; gap: 10px 16px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
.ueb-kopf b { font: 600 13px var(--titel); letter-spacing: .12em; text-transform: uppercase; color: var(--leise); }
.ueb-kopf span { font-size: 14px; }
.ueb-kopf .klein-knopf { margin-left: auto; }
.ueb-achse { position: relative; height: 30px; overflow: hidden; }
.ueb-achse span { position: absolute; top: 0; padding-left: 4px; border-left: 1px solid var(--linie2); font: 11px/1.3 var(--titel); letter-spacing: .06em;
  color: var(--sehrleise); white-space: nowrap; }
.ueb-achse small { display: block; font-size: 10.5px; color: var(--leise); }
.ueb-flaeche { position: relative; overflow: hidden; }
.ueb-tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--linie); }
.ueb-heute { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--bernstein); z-index: 1; pointer-events: none; }
.ueb-block { --farbe: var(--leise); position: absolute; height: 22px; min-width: 34px; padding: 0; border: 0; border-radius: 2px; overflow: hidden;
  cursor: pointer; background: color-mix(in srgb, var(--farbe) 20%, transparent); color: var(--tinte); font: inherit; text-align: left; z-index: 2; }
.ueb-block.aktiv, .ueb-muster.aktiv { --farbe: var(--bernstein); } .ueb-block.rot, .ueb-muster.rot { --farbe: var(--rot); }
.ueb-block.fertig, .ueb-muster.fertig { --farbe: var(--gruen); }
.ueb-block:hover, .ueb-block:focus-visible { outline: 2px solid var(--bernstein); outline-offset: 0; z-index: 4; }
.ueb-label { position: absolute; left: 5px; right: 3px; top: 1px; font-size: 12px; line-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ueb-label b { color: var(--farbe); margin-right: 4px; font-weight: 600; }
.ueb-block:not(.aktiv):not(.rot):not(.fertig) .ueb-label b { color: var(--tinte); }
.ueb-b50, .ueb-b85 { position: absolute; bottom: 0; height: 5px; }
.ueb-b50 { left: 0; background: var(--farbe); }
.ueb-b85 { right: 0; background: repeating-linear-gradient(135deg, var(--farbe) 0 3px, transparent 3px 6px); }
.ueb-puffer { position: absolute; height: 0; border-top: 1px dashed var(--leise); z-index: 1; }
.ueb-ziel { position: absolute; width: 9px; height: 9px; margin-left: -4.5px; transform: rotate(45deg); background: var(--flaeche);
  border: 2px solid var(--tinte); z-index: 3; pointer-events: auto; }
.ueb-ziel.rot { border-color: var(--rot); }
.ueb-weiter { position: absolute; right: 3px; font-size: 11.5px; line-height: 15px; color: var(--leise); background: var(--flaeche); padding-left: 4px; z-index: 3; }
.ueb-du { position: absolute; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--tinte); box-shadow: 0 0 0 2px var(--flaeche); z-index: 3; }
.ueb-ohne-liste { display: flex; gap: 6px 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; font-size: 13px; }
.ueb-ohne-liste button { background: none; border: 1px dashed var(--linie2); border-radius: 2px; padding: 2px 8px; color: inherit; font: inherit; cursor: pointer; }
.ueb-ohne-liste button:hover, .ueb-ohne-liste button:focus-visible { border-color: var(--bernstein); }
.ueb-legende { display: flex; gap: 6px 16px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--leise); }
.ueb-legende i { display: inline-block; vertical-align: middle; margin-right: 5px; position: static; }
.ueb-muster { --farbe: var(--leise); width: 18px; height: 9px; border-radius: 1px; background: color-mix(in srgb, var(--farbe) 18%, var(--flaeche));
  box-shadow: inset 0 -4px 0 var(--farbe); }
.ueb-muster.schraffur { box-shadow: none; background: repeating-linear-gradient(135deg, var(--leise) 0 3px, transparent 3px 6px); }
.ueb-legende .ueb-puffer { width: 18px; }
.ueb-legende .ueb-ziel { width: 8px; height: 8px; margin: 0 6px 0 2px; }
.ueb-legende .ueb-heute { display: inline-block; height: 12px; width: 2px; margin: 0 6px 0 0; }
.ueb-legende .ueb-du { margin: 0 5px 0 0; }
@media (max-width: 760px) {
  .befund-schluessel { margin-left: 0; flex-basis: 100%; } .befund-zeile > .sehrleise:first-child { min-width: 0; } }
/* Dokumente: Raster mit Vorschau, Detail mit Vorschau links und Zuordnung/Versionen/Gespräch rechts */
.dk-filter { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.dk-filter select, .dk-filter input { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 3px; padding: 6px 8px; color: var(--tinte); font: inherit; font-size: 14px; min-width: 0; }
.dk-filter input { flex: 1 1 220px; }
.dk-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.dk-karte { display: grid; grid-template-rows: 130px auto; border: 1px solid var(--linie); border-radius: 4px; background: var(--flaeche); overflow: hidden;
  cursor: pointer; text-align: left; padding: 0; color: inherit; font: inherit; }
.dk-nurpc { border: 0; }
.dk-karte:hover, .dk-karte:focus-visible { border-color: var(--bernstein); }
.dk-bild { display: grid; place-items: center; background: var(--flaeche2); overflow: hidden; border-bottom: 1px solid var(--linie); }
.dk-bild img { width: 100%; height: 100%; object-fit: cover; }
.dk-symbol { font: 600 22px var(--titel); letter-spacing: .12em; color: var(--leise); text-transform: uppercase; }
.dk-symbol small { display: block; font: 11px var(--mono); letter-spacing: 0; text-align: center; color: var(--sehrleise); margin-top: 4px; }
.dk-text { padding: 9px 11px; display: grid; gap: 3px; }
.dk-text b { font-size: 14.5px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dk-text span { font-size: 12.5px; color: var(--leise); }
.dk-liste .zeile { cursor: pointer; }
.dk-detail { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.dk-vorschau { min-height: 200px; border: 1px solid var(--linie); border-radius: 3px; background: var(--flaeche2); overflow: auto; max-height: 70vh; }
.dk-vorschau img { display: block; max-width: 100%; margin: 0 auto; }
.dk-vorschau iframe { display: block; width: 100%; height: 68vh; border: 0; background: #fff; }
.dk-vorschau .md { padding: 16px 20px; }
.dk-seite { display: grid; gap: 14px; font-size: 14px; }
.dk-seite h4 { margin: 0 0 6px; font: 600 12px var(--titel); letter-spacing: .1em; text-transform: uppercase; color: var(--leise); }
.dk-version { display: block; width: 100%; text-align: left; background: none; border: 0; border-left: 2px solid var(--linie); padding: 4px 8px; color: var(--leise); cursor: pointer; font: inherit; font-size: 13px; }
.dk-version.an { border-left-color: var(--bernstein); color: var(--tinte); }
.dk-nachricht { border-left: 2px solid var(--linie2); padding: 2px 8px; margin-bottom: 6px; font-size: 13px; }
.dk-aktionen { display: flex; gap: 6px; flex-wrap: wrap; }
.dk-anhaenge { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.dk-anhang { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linie); border-radius: 3px; padding: 4px 8px; cursor: pointer; background: var(--flaeche2); color: inherit; font: inherit; font-size: 13px; }
.dk-anhang img { width: 64px; height: 44px; object-fit: cover; border-radius: 2px; }
/* Vollbild für Bilder */
.vb { position: fixed; inset: 0; z-index: 30; background: #0b0a08; display: grid; grid-template-rows: minmax(0, 1fr) auto; color: #ece5d3; }
.vb-buehne { position: relative; overflow: hidden; touch-action: none; cursor: grab; user-select: none; }
.vb-buehne.zieht { cursor: grabbing; }
.vb-buehne img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; image-rendering: auto; will-change: transform; }
.vb-leiste { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  background: rgba(20,18,14,.92); border-top: 1px solid #353026; font-size: 13.5px; }
.vb-titel { flex: 1 1 240px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vb-hilfe { color: #8a826f; font-size: 12.5px; }
.vb-stufe { font: 12.5px var(--mono); color: #a39a86; min-width: 54px; text-align: right; }
.vb-knopf { min-width: 38px; height: 34px; padding: 0 10px; border: 1px solid #4a4335; border-radius: 3px; background: #1c1a15; color: #ece5d3;
  font: 600 14px var(--titel); letter-spacing: .04em; cursor: pointer; }
.vb-knopf:hover, .vb-knopf:focus-visible { border-color: #f0a93a; color: #f0a93a; }
.dk-vorschau img { cursor: zoom-in; }
@media (max-width: 760px) { .vb-hilfe, .vb-stufe, .vb-eins { display: none; } .vb-titel { flex-basis: 100%; } .vb-knopf { flex: 1 0 auto; min-width: 44px; height: 44px; } }
/* Markdown */
.md { font-size: 15px; line-height: 1.55; overflow-wrap: anywhere; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--titel); margin: 1.1em 0 .4em; line-height: 1.25; }
.md h1 { font-size: 22px; } .md h2 { font-size: 19px; } .md h3 { font-size: 16.5px; } .md h4 { font-size: 15px; }
.md h1, .md h2, .md h3, .md h4 { text-transform: none; letter-spacing: .01em; color: var(--tinte); display: block; }
.md h1::before, .md h1::after, .md h2::before, .md h2::after, .md h3::after { content: none; }
.dk-aktionen a.klein-knopf { text-decoration: none; display: inline-flex; align-items: center; }
/* D3: Varianten in Fragen, Versionsvergleich, Editor, Hochladen */
.varianten { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 12px 0 4px; }
.variante { display: grid; grid-template-rows: 160px auto; padding: 0; border: 1px solid var(--linie); border-radius: 4px; background: var(--flaeche);
  overflow: hidden; cursor: zoom-in; color: inherit; font: inherit; text-align: left; }
.variante:hover, .variante:focus-visible { border-color: var(--leise); }
.variante.empfohlen { border-color: var(--bernstein); }
.variante-bild { position: relative; overflow: hidden; background: var(--flaeche2); display: grid; place-items: center; border-bottom: 1px solid var(--linie); }
.variante-bild img { width: 100%; height: 100%; object-fit: cover; }
.variante-bild iframe { position: absolute; left: 0; top: 0; width: 300%; height: 300%; transform: scale(.3334); transform-origin: 0 0; border: 0;
  pointer-events: none; background: #fff; }
.variante-text { padding: 8px 11px; display: flex; gap: 9px; align-items: baseline; font-size: 14px; }
.variante-text .kenn { font: 600 15px var(--titel); color: var(--leise); }
.variante.empfohlen .kenn { color: var(--bernstein); }
.df { font: 12.5px/1.55 var(--mono); border: 1px solid var(--linie); border-radius: 3px; overflow: auto; max-height: 68vh; background: var(--flaeche2); }
.df-z { display: grid; grid-template-columns: 42px 42px 18px minmax(0, 1fr); }
.df-n { color: var(--sehrleise); text-align: right; padding-right: 7px; user-select: none; border-right: 1px solid var(--linie); font-size: 11.5px; }
.df-z-zeichen { text-align: center; color: var(--leise); user-select: none; }
.df-t { white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 10px; }
.df-weg { background: var(--rot-weich); }
.df-neu { background: color-mix(in srgb, var(--gruen) 14%, transparent); }
.df-weg mark { background: color-mix(in srgb, var(--rot) 38%, transparent); color: inherit; border-radius: 2px; }
.df-neu mark { background: color-mix(in srgb, var(--gruen) 40%, transparent); color: inherit; border-radius: 2px; }
.df-luecke { display: block; width: 100%; border: 0; border-block: 1px dashed var(--linie); background: var(--flaeche); color: var(--leise);
  font: 12px var(--text); padding: 3px; cursor: pointer; }
.df-luecke:hover { color: var(--tinte); }
.df-plus { color: var(--gruen); font-weight: 600; } .df-minus { color: var(--rot); font-weight: 600; }
.df-paar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.df-seite { display: grid; gap: 6px; align-content: start; }
.df-seite img { display: block; max-width: 100%; border: 1px solid var(--linie); cursor: zoom-in; }
.df-seite iframe { width: 100%; height: 62vh; border: 1px solid var(--linie); background: #fff; }
.dk-editor { display: block; width: 100%; height: max(240px, calc(88vh - 320px)); box-sizing: border-box; resize: vertical; font: 13.5px/1.6 var(--mono); tab-size: 2;
  background: var(--flaeche2); color: var(--tinte); border: 1px solid var(--linie); border-radius: 3px; padding: 12px 14px; }
.dk-editor:focus { outline: none; border-color: var(--bernstein); }
.dk-ed-vorschau { height: max(240px, calc(88vh - 320px)); max-height: none; }
.dk-ed-unten { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.dk-ed-unten input:not([type]) { flex: 1 1 320px; }
.dk-ed-unten .aktionen { margin: 0 0 0 auto; }
.reiter .rechts { margin-left: auto; padding: 0 4px 8px; }
.dk-seite h4 .dk-vergleich-knopf { margin-left: 8px; padding: 1px 8px; font: 12px var(--text); letter-spacing: 0; text-transform: none; vertical-align: 1px; }
.hl-zone { border: 2px dashed var(--linie2); border-radius: 4px; padding: 20px 14px; text-align: center; margin-bottom: 10px; transition: border-color .15s, background .15s; }
.hl-zone.drueber { border-color: var(--bernstein); background: var(--bernstein-weich); }
.hl-datei { display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--linie); }
.hl-datei img, .hl-datei .dk-symbol { width: 60px; height: 44px; object-fit: cover; border-radius: 2px; display: grid; place-items: center; background: var(--flaeche2); font-size: 11px; }
.hl-name { overflow-wrap: anywhere; font-size: 14px; }
.hl-datei progress { width: 100%; height: 6px; accent-color: var(--bernstein); }
.hl-schalter { display: block; margin: 6px 0; }
@media (max-width: 760px) {
  .df-paar { grid-template-columns: minmax(0, 1fr); }
  .df-z { grid-template-columns: 30px 30px 14px minmax(0, 1fr); }
  .varianten { grid-template-columns: minmax(0, 1fr); }
  .variante { grid-template-rows: 190px auto; }
  .dk-editor, .dk-ed-vorschau { height: max(220px, calc(100vh - 380px)); font-size: 14px; }
  .dk-ed-unten .aktionen { margin: 0; width: 100%; justify-content: flex-end; }
}
.md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 .8em; }
.md code { font: 13px var(--mono); background: var(--flaeche); padding: 1px 4px; border-radius: 2px; }
.md pre { background: var(--flaeche); border: 1px solid var(--linie); padding: 10px 12px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { border-left: 3px solid var(--linie2); padding-left: 12px; color: var(--leise); }
.md table { border-collapse: collapse; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--linie); padding: 4px 8px; text-align: left; vertical-align: top; }
.md hr { border: 0; border-top: 1px solid var(--linie); margin: 1.2em 0; }
.md a { color: var(--bernstein); }
@media (max-width: 900px) { .dk-detail { grid-template-columns: minmax(0, 1fr); } .dk-vorschau iframe { height: 60vh; } }
@media (max-width: 760px) { .dk-raster { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .dk-karte { grid-template-rows: 100px auto; } }
@media (max-width: 760px) { .zeitleiste { padding-left: 20px; } .tl-punkt { left: -19px; } .tl-heute { margin-left: -20px; }
  .schritt { grid-template-columns: 54px minmax(0, 1fr); } .schritt > .etikett { grid-column: 2; justify-self: start; } .tl-knoepfe { margin-left: 0; } }
/* Rückblick und Verlauf */
.rb-raster { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.rb-spalte { background: var(--grund); border: 1px solid var(--linie); border-top: 3px solid var(--linie2); border-radius: 4px; padding: 8px 10px; min-height: 80px; }
.rb-spalte h4 { display: flex; gap: 8px; align-items: center; font: 12px var(--titel); letter-spacing: .1em; text-transform: uppercase; color: var(--leise); margin: 0 0 6px; }
.rb-gut { border-top-color: var(--gruen); } .rb-schlecht { border-top-color: var(--rot); } .rb-massnahme { border-top-color: var(--bernstein); } .rb-gelernt { border-top-color: var(--tinte); }
.rb-eintrag { padding: 6px 0; border-bottom: 1px dashed var(--linie); font-size: 13.5px; overflow-wrap: anywhere; }
.rb-eintrag .klein-knopf { white-space: nowrap; padding: 3px 7px; font-size: 11px; }
.rb-neu { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 8px; margin-top: 12px; align-items: start; }
.band-seit { display: grid; gap: 4px; padding: 12px 18px; border: 1px solid var(--linie2); background: var(--flaeche); border-radius: 4px; margin-bottom: 18px; }
.band-seit b { font: 600 14px var(--titel); letter-spacing: .08em; text-transform: uppercase; color: var(--leise); }
.vl-filter { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.vl-filter select { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 3px; padding: 5px 8px; color: var(--tinte); }
.vl-chip { font: 12px var(--titel); letter-spacing: .04em; padding: 3px 10px; border-radius: 12px; border: 1px solid var(--linie2); background: var(--grund); color: var(--leise); cursor: pointer; }
.vl-chip.an { border-color: var(--bernstein); color: var(--bernstein); }
.vl-tag { position: relative; display: grid; gap: 2px; padding-left: 4px; }
.vl-zeile { display: grid; grid-template-columns: 46px 10px 90px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--linie); font-size: 13.5px; }
.vl-wer { font: 12.5px var(--mono); color: var(--leise); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vl-text { overflow-wrap: anywhere; }
@media (max-width: 760px) { .rb-raster { grid-template-columns: minmax(0, 1fr); } .rb-neu { grid-template-columns: minmax(0, 1fr); }
  .vl-zeile { grid-template-columns: 42px 10px minmax(0, 1fr); } .vl-wer { display: none; } nav a.nur-breit { display: none !important; } }
.mini-balken { display: grid; gap: 3px; margin-top: 8px; }
.mb { display: grid; grid-template-columns: 54px 1fr 38px; gap: 6px; align-items: center; font-size: 11px; color: var(--sehrleise); }
.mb-spur { height: 5px; background: var(--grund); border-radius: 3px; overflow: hidden; } .mb-spur i { display: block; height: 100%; }
.push-gruppe { border-top: 1px solid var(--linie); margin-top: 12px; padding-top: 8px; }
.push-gruppe h4 { font: 12px var(--titel); letter-spacing: .12em; text-transform: uppercase; color: var(--leise); margin: 4px 0; }
.rot-text { color: var(--rot); } .bernstein-text { color: var(--bernstein); }
.kachel .zustand { flex-wrap: wrap; row-gap: 2px; }
.sprung { display: flex; gap: 8px 14px; flex-wrap: wrap; margin: -6px 0 14px; font-size: 13px; }
.sprung a { color: var(--leise); cursor: pointer; border-bottom: 1px dotted var(--linie2); }

.wartet { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.wartet .karte { padding: 14px 16px; border-left: 3px solid var(--bernstein); cursor: pointer; transition: transform .15s, border-color .15s; }
.wartet .karte:hover { transform: translateY(-2px); border-color: var(--bernstein); }
.wartet .karte p { margin: 6px 0 0; }

.agenten { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.kachel { padding: 14px 16px 12px; position: relative; overflow: hidden; }
.kachel .name { font: 600 26px/1 var(--titel); letter-spacing: .04em; }
.kachel .rolle { font: 11px var(--titel); letter-spacing: .12em; text-transform: uppercase; color: var(--sehrleise); margin-top: 2px; }
.kachel .zustand { display: flex; align-items: center; gap: 8px; margin-top: 12px; font: 13px var(--titel); letter-spacing: .04em; }
.kachel .info { margin-top: 8px; color: var(--leise); font-size: 12.5px; min-height: 36px; overflow-wrap: anywhere; }
.kachel .offen { position: absolute; top: 12px; right: 14px; font: 600 13px var(--mono); }
.kachel.tot { border-color: color-mix(in srgb, var(--rot) 45%, var(--linie)); }
.kachel.aus { opacity: .55; }
.kachel.klickbar { cursor: pointer; } .kachel.klickbar:hover { border-color: var(--leise); }
.dialog.agent-dialog { width: min(1180px, 66vw); max-height: 88vh; overflow-y: auto; padding: 22px 26px; }   /* .dialog allein: 520 px */
@media (max-width: 1400px) { .dialog.agent-dialog { width: 88vw; } }
.agent-kopf { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--linie); }
.dialog .agent-kopf h3 { color: var(--tinte); margin: 0; font-size: 26px; }
.agent-spalten { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 28px; }
@media (max-width: 1000px) { .agent-spalten { grid-template-columns: minmax(0, 1fr); } }   /* nach der Grundregel, sonst gilt sie nie */
.agent-dialog .ref { white-space: nowrap; }
.agent-dialog .abschnitt { margin-top: 18px; }
.agent-dialog h4 { display: flex; align-items: center; gap: 8px; font: 12px var(--titel); letter-spacing: .12em; text-transform: uppercase;
  color: var(--leise); margin: 0 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--linie); }
.agent-dialog h4 .anzahl { font: 11px var(--mono); color: var(--sehrleise); background: var(--grund); padding: 0 6px; border-radius: 8px; }
.agent-dialog .eintraege { display: grid; gap: 8px; }
.agent-dialog .eintrag { background: var(--grund); border: 1px solid var(--linie); border-left: 3px solid var(--sehrleise);
  border-radius: 3px; padding: 8px 12px; font-size: 13.5px; line-height: 1.45; overflow-wrap: anywhere; }
.agent-dialog .eintrag-kopf { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.agent-dialog .eintrag-meta { margin-left: auto; font-size: 12px; white-space: nowrap; }
.agent-dialog .eintrag-zusatz { font-size: 12px; margin-top: 3px; }
.agent-dialog .eintrag-text.gross { font-size: 15px; font-weight: 600; }
.agent-dialog .leer-klein { font-size: 13px; padding: 2px 0; }
/* --- Gespräch je Agent ------------------------------------------------------------------------- */
.gs-tabs { display: flex; gap: 2px; margin-top: 12px; border-bottom: 1px solid var(--linie); }
.gs-tabs button { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 7px 14px 6px; cursor: pointer;
  color: var(--leise); font: 12px var(--titel); letter-spacing: .12em; text-transform: uppercase; }
.gs-tabs button:hover { color: var(--tinte); }
.gs-tabs button[aria-selected="true"] { color: var(--tinte); border-bottom-color: var(--bernstein); }
.gs-kopf { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 14px 0 10px; }
.gs-kopf select { background: var(--grund); border: 1px solid var(--linie); border-radius: 3px; padding: 5px 8px; max-width: 280px; }
.gs-kopf label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--leise); cursor: pointer; }
.gs-kopf .gs-rechts { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.gs-titel { flex-basis: 100%; font-size: 12px; color: var(--sehrleise); }
.gs-hilfe { font-size: 12px; color: var(--sehrleise); max-width: 520px; }
a.knopf { text-decoration: none; display: inline-flex; align-items: center; color: var(--tinte); }
.gs-rahmen { position: relative; }
.gs-liste { height: min(60vh, 760px); overflow-y: auto; background: var(--grund); border: 1px solid var(--linie); border-radius: 4px;
  padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 10px; }
.gs-zeile { display: flex; }
.gs-mensch { justify-content: flex-end; }
.gs-blase { max-width: min(80%, 780px); padding: 9px 12px 5px; border-radius: 6px; border: 1px solid var(--linie); background: var(--flaeche);
  font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; min-width: 0; }
.gs-mensch .gs-blase { background: var(--bernstein-weich); border-color: color-mix(in srgb, var(--bernstein) 35%, var(--linie)); white-space: pre-wrap; }
.gs-claude .gs-blase { border-left: 3px solid var(--gruen); }
.gs-claude .md > :first-child { margin-top: 0; } .gs-claude .md > :last-child { margin-bottom: 0; }
.gs-claude .md pre { max-height: 320px; overflow: auto; }
.gs-zeit { display: block; text-align: right; font: 11px var(--mono); color: var(--sehrleise); margin-top: 2px; }
.gs-weckruf { gap: 8px; align-items: baseline; font-size: 13px; color: var(--leise); }
.gs-weckruf .gs-text { white-space: pre-wrap; max-height: 2.9em; overflow: hidden; cursor: pointer; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.gs-weckruf .gs-text.auf { max-height: none; }
.gs-weckruf .gs-zeit { margin: 0; }
.gs-etikett { font: 11px var(--mono); color: var(--bernstein); border: 1px solid color-mix(in srgb, var(--bernstein) 40%, transparent);
  border-radius: 8px; padding: 0 6px; white-space: nowrap; }
.gs-hinweis { align-self: center; font-size: 12px; color: var(--sehrleise); text-align: center; max-width: 86%; overflow-wrap: anywhere; }
.gs-hinweis.fehler { color: var(--rot); }
.gs-tag { align-self: center; font: 11px var(--titel); letter-spacing: .14em; text-transform: uppercase; color: var(--sehrleise); margin: 4px 0 0; }
.gs-gruppe { align-self: stretch; min-width: 0; }
