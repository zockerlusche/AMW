<style>
:root {
  --grund: #13120e; --flaeche: #1c1a15; --flaeche2: #24211b; --linie: #353026; --linie2: #4a4335;
  --tinte: #ece5d3; --leise: #a39a86; --sehrleise: #6f6858;
  --bernstein: #f0a93a; --bernstein-weich: rgba(240,169,58,.12);
  --gruen: #86b46f; --rot: #e5583a; --rot-weich: rgba(229,88,58,.14); --blau: #6fa3c8; --glut: #e8743b;
  --token: #c9a0ff;                                 /* Token-Pause: Violett – in keinem anderen Zustand benutzt */
  --projekt-farbe: var(--bernstein);
  --schatten: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 30px -18px rgba(0,0,0,.8);
  --titel: "Bahnschrift", "DIN Alternate", "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  --text: "Segoe UI Variable Text", "Segoe UI", "Source Sans 3", -apple-system, "Roboto", sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", "JetBrains Mono", "SF Mono", Consolas, monospace;
}
:root[data-thema="hell"] {
  --grund: #efe9da; --flaeche: #f8f4ea; --flaeche2: #f1ebdc; --linie: #d8cfba; --linie2: #c4b99f;
  --tinte: #211e17; --leise: #6b6250; --sehrleise: #9a907b;
  --bernstein: #b46d07; --bernstein-weich: rgba(180,109,7,.10);
  --gruen: #4c7d36; --rot: #b8381c; --rot-weich: rgba(184,56,28,.10); --blau: #2f6f9a; --glut: #c4501f;
  --token: #6c3fb5;
  --schatten: 0 10px 24px -18px rgba(60,45,10,.45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--grund); color: var(--tinte); font: 14px/1.45 var(--text);
  background-image:
    repeating-linear-gradient(0deg, transparent 0 31px, rgba(255,255,255,.018) 31px 32px),
    radial-gradient(1200px 500px at 85% -10%, var(--bernstein-weich), transparent 60%);
}
:root[data-thema="hell"] body { background-image: repeating-linear-gradient(0deg, transparent 0 31px, rgba(0,0,0,.03) 31px 32px); }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: 12.5px; letter-spacing: -.01em; }
.leise { color: var(--leise); }
.sehrleise { color: var(--sehrleise); }

/* --- Rahmen ------------------------------------------------------------------------------- */
.rahmen { display: grid; grid-template-columns: 216px 1fr; grid-template-rows: 58px 1fr; height: 100vh; height: 100dvh; }
header {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding: 0 18px 0 0;
  border-bottom: 1px solid var(--linie); background: color-mix(in srgb, var(--grund) 85%, transparent);
  backdrop-filter: blur(6px); position: relative; z-index: 2;
}
header::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--projekt-farbe); }
.marke { width: 216px; height: 100%; display: flex; align-items: center; gap: 10px; padding-left: 18px; border-right: 1px solid var(--linie); flex: none; }
.marke .logo { width: 66px; height: 41px; flex: none; }   /* Logo A·M·W als Neuronenzug (F5229) */
.marke span { font: 10px/1.2 var(--titel); letter-spacing: .06em; color: var(--sehrleise); text-transform: uppercase; }
.marke span i { font-style: normal; font-weight: 600; color: var(--tinte); }
.signale { display: flex; gap: 8px; align-items: center; flex: 0 1 auto; min-width: 0; overflow: hidden; }   /* ganze Wörter statt Kürzel: eine Zeile, die Suche gibt Platz ab */
.signal { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border: 1px solid var(--linie);
  border-radius: 3px; font: 12.5px var(--text); color: var(--leise); background: var(--flaeche); white-space: nowrap; flex: none; }
.punkt { width: 8px; height: 8px; border-radius: 50%; background: var(--sehrleise); flex: none; }
.punkt.gruen { background: var(--gruen); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gruen) 20%, transparent); }
.punkt.bernstein { background: var(--bernstein); box-shadow: 0 0 0 3px var(--bernstein-weich); }
.punkt.rot { background: var(--rot); box-shadow: 0 0 0 3px var(--rot-weich); animation: puls 1.6s infinite; }
@keyframes puls { 50% { opacity: .35; } }
.suche { margin-left: auto; position: relative; flex: 0 1000 380px; min-width: 150px; }   /* gibt zuerst Platz ab, dann erst die Hinweise */
.suche input { width: 100%; max-width: 380px; min-width: 0; padding: 8px 12px 8px 30px; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 3px; outline: none; }
.suche input:focus { border-color: var(--bernstein); }
.suche::before { content: "⌕"; position: absolute; left: 10px; top: 6px; color: var(--sehrleise); font-size: 16px; }

nav { border-right: 1px solid var(--linie); padding: 14px 0; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
nav .gruppe { font: 11px var(--titel); letter-spacing: .14em; text-transform: uppercase; color: var(--sehrleise); padding: 14px 18px 6px; }
nav a { display: flex; align-items: baseline; gap: 10px; padding: 8px 18px; color: var(--leise); text-decoration: none; cursor: pointer;
  border-left: 3px solid transparent; font: 15px var(--titel); letter-spacing: .02em; }
nav a .sym { display: none; }
nav a.nur-handy { display: none; }
.mehr-liste { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mehr-liste button { display: grid; justify-items: center; gap: 4px; padding: 12px 4px; min-height: 72px; border: 1px solid var(--linie);
  border-radius: 8px; background: var(--grund); color: var(--tinte); font: 13px var(--titel); cursor: pointer; position: relative; }
.mehr-liste button.an { border-color: var(--bernstein); color: var(--bernstein); }
.mehr-liste .sym { font-size: 20px; line-height: 1; }
.mehr-liste .zahl { position: absolute; top: 6px; right: 8px; font: 11px var(--mono); color: var(--sehrleise); }
.mehr-fuss { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
.mehr-fuss .version { margin-left: auto; font: 11px var(--mono); color: var(--sehrleise); }
nav a:hover { color: var(--tinte); background: var(--flaeche); }
nav a.an { color: var(--tinte); border-left-color: var(--bernstein); background: linear-gradient(90deg, var(--bernstein-weich), transparent); }
nav a .zahl { margin-left: auto; font: 12px var(--mono); color: var(--sehrleise); }
nav a .zahl.heiss { color: #1b1408; background: var(--bernstein); padding: 0 7px; border-radius: 9px; font-weight: 600; }
nav .fuss { margin-top: auto; padding: 14px 18px; display: flex; gap: 8px; flex-wrap: wrap; }
/* Projekt-Auswahl: oben in der Navigation, am Handy als Chip im Kopf (doc/plan-projektwahl.md) */
.pw { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 9px; align-items: center; width: calc(100% - 24px); margin: 0 12px 6px; padding: 7px 10px;
  border: 1px solid var(--linie2); border-radius: 3px; background: var(--flaeche); color: var(--tinte); cursor: pointer; text-align: left; font: inherit; }
.pw:hover, .pw:focus-visible { border-color: var(--leise); }
.pw-farbe { width: 10px; height: 10px; border-radius: 2px; background: var(--projekt-farbe); flex: none; }
.pw-klein { display: block; font: 10px var(--titel); letter-spacing: .12em; text-transform: uppercase; color: var(--sehrleise); }
.pw-name { display: block; font: 600 15px var(--titel); letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pw-pfeil { color: var(--leise); font-size: 12px; }
.pw.still { cursor: default; } .pw.still .pw-pfeil { display: none; }
.projekt-chip { display: none; }
.dialog-hg.pw-hg { background: transparent; display: block; padding: 0; }
.bn-liste{display:grid;gap:10px;margin-bottom:12px}.bn-zeile{border:1px solid var(--linie);border-radius:6px;padding:10px 12px;display:grid;gap:8px}.bn-kopf{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}.bn-felder{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:12px}@media (max-width:640px){.bn-felder{grid-template-columns:1fr}}.bn-label{display:grid;gap:4px;font-size:12px;color:var(--leise)}.bn-projekte{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--text)}.bn-projekt{display:inline-flex;align-items:center;gap:4px;cursor:pointer}.bn-projekte[hidden],.bn-label [hidden]{display:none}.bn-knoepfe{display:flex;gap:8px;flex-wrap:wrap}.bn-neu{display:flex;gap:8px;flex-wrap:wrap}.bn-neu input{max-width:260px}.bn-code{font-size:clamp(20px,5vw,30px);letter-spacing:.08em;padding:14px;text-align:center;border:1px dashed var(--linie);border-radius:6px;user-select:all}
.pw-liste { position: absolute; width: 310px; max-width: calc(100vw - 24px); border: 1px solid var(--linie2); background: var(--flaeche2); border-radius: 4px;
  box-shadow: 0 16px 40px -10px rgba(0,0,0,.7); padding: 6px; }
.pw-liste .dialog-zu { display: none; }
.pw-liste h3 { display: none; }
.pw-eintrag { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 9px 10px; border: 0;
  border-radius: 3px; background: none; color: var(--tinte); text-align: left; font: inherit; cursor: pointer; min-height: 48px; }
.pw-eintrag:hover, .pw-eintrag:focus-visible { background: var(--flaeche); }
.pw-eintrag.an { background: var(--bernstein-weich); }
.pw-eintrag b { font: 600 15px var(--titel); letter-spacing: .03em; }
.pw-eintrag small { display: block; color: var(--leise); font-size: 12px; }
.pw-zahl { font: 600 12px var(--titel); color: var(--bernstein); white-space: nowrap; }
.pw-fuss { border-top: 1px solid var(--linie); margin-top: 6px; padding: 8px 10px 4px; display: grid; gap: 4px; }
.pc-marke { display: inline-block; font: 10.5px var(--titel); letter-spacing: .08em; text-transform: uppercase; padding: 1px 6px; border: 1px solid var(--blau);
  border-radius: 2px; color: var(--blau); vertical-align: middle; }
tr.fremd td { color: var(--sehrleise); font-style: italic; }
.klein-knopf { font: 12px var(--titel); letter-spacing: .06em; text-transform: uppercase; padding: 6px 10px; border: 1px solid var(--linie2);
  background: transparent; border-radius: 3px; cursor: pointer; color: var(--leise); }
.klein-knopf:hover { color: var(--tinte); border-color: var(--leise); }

main { overflow-y: auto; padding: 26px 30px 60px; }
.kopf { display: flex; align-items: baseline; gap: 14px; margin: 0 0 18px; flex-wrap: wrap; }
/* Fester Seitenkopf – ein Baustein für alle Seiten: Die Titelzeile läuft beim Scrollen hinaus, die Untermenüs der Seite
   (Reiter, Filter, Sprungmarken) bleiben oben stehen. Wie weit er hinausläuft (top), setzt seitenkopf(). */
.seitenkopf { position: relative; }
.seitenkopf.mit-menue { position: sticky; z-index: 6; margin: -26px -30px 16px; padding: 26px 30px 0; border-bottom: 1px solid transparent;
  transition: background-color .15s, box-shadow .15s; }
.seitenkopf.mit-menue > :last-child { margin-bottom: 0; }
.seitenkopf.mit-menue > :last-child:not(.reiter) { padding-bottom: 10px; }
.seitenkopf.fest { background: color-mix(in srgb, var(--grund) 90%, transparent); backdrop-filter: blur(8px); border-bottom-color: var(--linie);
  box-shadow: 0 14px 18px -20px rgba(0,0,0,.7); }
.seitenkopf.fest:has(> .reiter:last-child) { border-bottom-color: transparent; }
.reiter-zeile { display: contents; }
h1 { font: 600 28px/1.1 var(--titel); letter-spacing: .03em; margin: 0; }
h2 { font: 600 13px var(--titel); letter-spacing: .16em; text-transform: uppercase; color: var(--leise); margin: 30px 0 12px;
  display: flex; align-items: center; gap: 10px; }
h2::after { content: ""; flex: 1; height: 1px; background: var(--linie); }
.zeile-reveal > * { animation: auf .45s cubic-bezier(.2,.7,.2,1) both; }
.zeile-reveal > *:nth-child(2) { animation-delay: .04s } .zeile-reveal > *:nth-child(3) { animation-delay: .08s }
.zeile-reveal > *:nth-child(4) { animation-delay: .12s } .zeile-reveal > *:nth-child(5) { animation-delay: .16s }
.zeile-reveal > *:nth-child(n+6) { animation-delay: .2s }
.still .zeile-reveal > * { animation: none; }
nav .fuss .version { width: 100%; font: 11px var(--mono); color: var(--sehrleise); letter-spacing: 0; }
.einst { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; max-width: 980px; }
.einst > * { min-width: 0; }   /* sonst zieht die breite Agenten-Tabelle alle Karten über den Handy-Rand */
.einst .karte { padding: 16px 18px; }
.einst h3, .dialog > h3 { font: 600 15px var(--titel); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 10px; }
.einst .feld { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 6px 14px; align-items: start; padding: 5px 0; }
.einst .feld > label { color: var(--leise); font-size: 13px; padding-top: 7px; }
.einst input:not([type=checkbox]), .einst select { width: 100%; max-width: 420px; padding: 7px 9px; background: var(--grund); color: var(--tinte);
  border: 1px solid var(--linie); border-radius: 3px; font: inherit; font-size: 14px; }
.einst input[type=checkbox] { width: 18px; height: 18px; margin-top: 8px; accent-color: var(--bernstein); }
.einst table.tab input:not([type=checkbox]), .einst table.tab select { min-width: 70px; }
.einst table.tab td { vertical-align: middle; }
.einst .gesperrt { opacity: .65; }
@keyframes auf { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* --- Bausteine ---------------------------------------------------------------------------- */
.karte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 4px; box-shadow: var(--schatten); }
.ref { font: 12.5px var(--mono); color: var(--bernstein); }
.etikett { display: inline-block; font: 11px var(--titel); letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px;
  border: 1px solid var(--linie2); border-radius: 2px; color: var(--leise); white-space: nowrap; }
.etikett.rot { border-color: var(--rot); color: var(--rot); }
.etikett.bernstein { border-color: var(--bernstein); color: var(--bernstein); }
.etikett.gruen { border-color: var(--gruen); color: var(--gruen); }
.ki-kopf { margin: 18px 0 8px; font-size: 14px; }
.dk-prompt { margin-top: 6px; padding: 6px 8px; border-left: 2px solid var(--linie); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 9em; overflow: auto; }
.leer { padding: 22px; color: var(--sehrleise); border: 1px dashed var(--linie); border-radius: 4px; text-align: center; }

.band-halt { display: flex; gap: 14px; align-items: center; padding: 14px 18px; border: 1px solid var(--rot); background: var(--rot-weich);
  border-radius: 4px; margin-bottom: 18px; flex-wrap: wrap; }
.band-halt b { font: 600 18px var(--titel); letter-spacing: .1em; color: var(--rot); }
.band-warn { display: grid; gap: 4px; padding: 12px 18px; border: 1px solid var(--bernstein); background: var(--bernstein-weich);
  border-radius: 4px; margin-bottom: 18px; }
.band-warn b { font: 600 14px var(--titel); letter-spacing: .1em; color: var(--bernstein); }
.band-zeile { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .band-zeile .klein-knopf { margin-left: auto; }
/* Schirm-Schalter: frei = Agenten dürfen Fenster öffnen – auffällig; zu mit wartenden Läufen – ruhig */
.band-schirm { display: flex; gap: 14px; align-items: center; padding: 12px 18px; border: 1px solid var(--linie); background: var(--flaeche);
  border-radius: 4px; margin-bottom: 18px; flex-wrap: wrap; }
.band-schirm.frei { border-color: var(--bernstein); background: var(--bernstein-weich); }
.band-schirm b { font: 600 15px var(--titel); letter-spacing: .1em; }
.band-schirm.frei b { color: var(--bernstein); }
.band-schirm > div { flex: 1 1 320px; }
.band-schirm .knopf { margin-left: auto; }
.signal.knopflich { cursor: pointer; }
.signal.knopflich:hover { border-color: var(--leise); }
.kurztext { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.kurztext.auf { display: block; -webkit-line-clamp: unset; }
.mehr { font: 12px var(--titel); letter-spacing: .06em; color: var(--sehrleise); cursor: pointer; background: none; border: 0; padding: 4px 0 0; }
.nachtrag-neu { margin-left: 8px; }
/* Planung: senkrechte Zeitleiste */
.zeitleiste { position: relative; display: grid; gap: 14px; padding-left: 26px; margin-top: 8px; }
.zeitleiste::before { content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px; background: var(--linie2); }
.tl-heute { position: relative; margin: 2px 0 -4px -26px; display: flex; align-items: center; gap: 8px; }
.tl-heute::before { content: ""; width: 18px; height: 2px; background: var(--bernstein); }
.tl-heute span { font: 12px var(--titel); letter-spacing: .12em; text-transform: uppercase; color: var(--bernstein); }
.tl-heute::after { content: ""; flex: 1; height: 1px; background: color-mix(in srgb, var(--bernstein) 50%, transparent); }
.tl-bogen { position: relative; padding: 14px 16px; display: grid; gap: 6px; }
.tl-bogen.status-fertig { opacity: .75; } .tl-bogen.status-verworfen { opacity: .45; }
.tl-punkt { position: absolute; left: -24px; top: 18px; width: 12px; height: 12px; border-radius: 50%; background: var(--sehrleise); border: 2px solid var(--grund); }
.tl-punkt.gruen { background: var(--gruen); } .tl-punkt.bernstein { background: var(--bernstein); } .tl-punkt.rot { background: var(--rot); }
.tl-kopf { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tl-titel { font: 600 18px var(--titel); letter-spacing: .02em; }
.tl-knoepfe { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.tl-zeile { font-size: 14px; overflow-wrap: anywhere; }
.tl-fortschritt { display: grid; grid-template-columns: minmax(80px, 260px) auto; gap: 10px; align-items: center; }
.tl-daten { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13.5px; }
.tl-specs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spec-chip { font: 12px var(--titel); letter-spacing: .04em; padding: 3px 9px; border-radius: 12px; border: 1px solid var(--linie2); background: var(--grund); color: var(--leise); cursor: pointer; }
.spec-chip.spec-frei { border-color: var(--gruen); color: var(--gruen); }
.spec-chip.spec-vorgelegt { border-color: var(--bernstein); color: var(--bernstein); font-weight: 600; }
.spec-chip.spec-zurueck { border-color: var(--rot); color: var(--rot); }
.tl-schritte summary { cursor: pointer; font: 12px var(--titel); letter-spacing: .1em; text-transform: uppercase; color: var(--leise); margin-top: 4px; }
.welle { margin-top: 8px; } .welle-kopf { font: 11px var(--titel); letter-spacing: .12em; text-transform: uppercase; color: var(--sehrleise); margin-bottom: 4px; }
.schritt { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; padding: 6px 8px;
  border-left: 3px solid var(--linie2); background: var(--grund); border-radius: 3px; margin-bottom: 4px; font-size: 13.5px; }
.schritt.status-laeuft { border-left-color: var(--gruen); } .schritt.status-fertig { opacity: .6; } .schritt.status-blockiert { border-left-color: var(--rot); }
.schritt.mensch { border-left-color: var(--bernstein); background: var(--bernstein-weich); }

  font: 11.5px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow-y: auto; }
.gs-pre.fehler { border-color: var(--rot); }
.gs-pre-titel { font: 10.5px var(--titel); letter-spacing: .12em; text-transform: uppercase; color: var(--sehrleise); margin-top: 4px; }
.gs.ohne-schritte .gs-gruppe { display: none; }
.gs-neu { position: absolute; right: 18px; bottom: 14px; box-shadow: var(--schatten); }
.gs-neu[hidden] { display: none; }
.gs-mehr { align-self: center; }
.leer-gs { margin: auto; color: var(--sehrleise); font-size: 13px; text-align: center; max-width: 440px; }
@media (max-width: 760px) {
  .gs-liste { height: calc(100dvh - 330px); min-height: 300px; padding: 10px; }
  .gs-blase { max-width: 94%; }
  .gs-kopf .gs-rechts { margin-left: 0; }
  .gs-tabs button { flex: 1; min-height: 40px; }
  .agent-dialog { position: relative; }
  .agent-kopf { padding-right: 40px; gap: 6px 12px; }
  .agent-kopf > .klein-knopf:last-child { position: absolute; top: 14px; right: 14px; }
  .agent-kopf > span:nth-of-type(2) { margin-left: 0 !important; width: 100%; }
  .agent-kopf .knopf { flex: 1 1 auto; justify-content: center; padding: 8px 10px; font-size: 11px; }
}
.verlauf { display: grid; gap: 8px; margin: 12px 0 14px; }
.blase { max-width: 82%; padding: 8px 12px; border-radius: 10px 10px 10px 2px; background: var(--grund); border: 1px solid var(--linie);
  justify-self: start; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-wrap; }
.blase.ich { justify-self: end; border-radius: 10px 10px 2px 10px; background: var(--bernstein-weich);
  border-color: color-mix(in srgb, var(--bernstein) 45%, var(--linie)); }
.blase.unterwegs { opacity: .7; border-style: dashed; }
.blase.vermerk { justify-self: center; max-width: 92%; background: none; border-style: dashed; font-size: 13px; color: var(--leise); }
.reiter button .zahl { font: 12px var(--mono); color: var(--sehrleise); }
.blase .wer { font: 11px var(--titel); letter-spacing: .06em; text-transform: uppercase; color: var(--sehrleise); margin-bottom: 2px; white-space: normal; }
/* Rand nach Status bzw. Art */
.eintrag.laeuft, .eintrag.lauf { border-left-color: var(--gruen); }
.eintrag.wartet, .eintrag.vermutet, .eintrag.frage, .eintrag.pruefbitte { border-left-color: var(--bernstein); }
.eintrag.blockiert, .eintrag.stopp, .eintrag.korrektur { border-left-color: var(--rot); }
.eintrag.auftrag, .eintrag.freigabe { border-left-color: var(--tinte); }
.eintrag.meldung, .eintrag.antwort, .eintrag.info, .eintrag.takt { border-left-color: var(--leise); }

.frage { padding: 18px 20px; margin-bottom: 16px; }
.karte.weg { opacity: 0; transform: translateX(14px); transition: opacity .3s, transform .3s; }
.neuer-stand { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 60; display: flex; gap: 12px;
  align-items: center; padding: 8px 10px 8px 16px; box-shadow: 0 6px 24px rgba(0,0,0,.35); max-width: calc(100% - 32px); }
.neuer-stand .knopf { flex: none; width: auto; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .karte.weg { transition: none; } }
.frage .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--leise); font-size: 12.5px; }
.frage h3 { font: 600 19px/1.3 var(--titel); letter-spacing: .01em; margin: 10px 0 6px; overflow-wrap: anywhere; }
.frage .haelt { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 10px; }
.frage .worum { color: var(--leise); margin: 0 0 12px; white-space: pre-wrap; }
.optionen { display: grid; gap: 8px; margin: 12px 0; }
.option { text-align: left; padding: 10px 14px; min-height: 44px; background: var(--flaeche2); border: 1px solid var(--linie); border-radius: 3px; cursor: pointer;
  display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: start; transition: border-color .12s, background .12s; }
.option:hover { border-color: var(--leise); }
.option .kenn { font: 600 15px var(--titel); color: var(--leise); min-width: 0; overflow-wrap: anywhere; }
.option.empfohlen { border-color: var(--bernstein); background: linear-gradient(90deg, var(--bernstein-weich), var(--flaeche2) 70%); }
.option.empfohlen .kenn { color: var(--bernstein); }
.option.gewaehlt { outline: 2px solid var(--tinte); outline-offset: 1px; }
.option[disabled] { cursor: default; }
.grund { border-left: 2px solid var(--bernstein); padding: 2px 0 2px 12px; margin: 10px 0; color: var(--leise); }
.grund b { color: var(--tinte); font-weight: 600; }
textarea { width: 100%; min-height: 64px; resize: vertical; padding: 10px 12px; background: var(--grund); border: 1px solid var(--linie);
  border-radius: 3px; outline: none; }
textarea:focus { border-color: var(--bernstein); }
.aktionen { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
.knopf { font: 600 13px var(--titel); letter-spacing: .08em; text-transform: uppercase; padding: 8px 14px; min-height: 38px; border-radius: 3px; cursor: pointer;
  border: 1px solid var(--linie2); background: var(--flaeche2); }
.knopf:hover { border-color: var(--leise); }
.knopf.haupt { background: var(--bernstein); border-color: var(--bernstein); color: #1b1408; }
.knopf[disabled], .klein-knopf[disabled] { opacity: .4; cursor: default; }
.rueckmeldung { font-size: 12.5px; }
details.vor { margin-top: 14px; border-top: 1px solid var(--linie); padding-top: 10px; }
details.vor summary { cursor: pointer; color: var(--leise); font: 12px var(--titel); letter-spacing: .1em; text-transform: uppercase; list-style: none; padding: 4px 0; }
details.vor summary::before { content: "▸ "; } details.vor[open] summary::before { content: "▾ "; }
.vor-eintrag { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--linie); }
.vor-eintrag:last-child { border-bottom: 0; }
.vor-eintrag .text { color: var(--leise); white-space: pre-wrap; font-size: 12.5px; margin-top: 2px; max-height: 9em; overflow: auto; overflow-wrap: anywhere; }

.reiter { display: flex; gap: 2px; border-bottom: 1px solid var(--linie); margin-bottom: 16px; align-items: flex-end; flex-wrap: wrap; }
.reiter button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; cursor: pointer; color: var(--leise);
  font: 14px var(--titel); letter-spacing: .04em; white-space: nowrap; }
.reiter button.an { color: var(--tinte); border-bottom-color: var(--bernstein); }
.reiter .rechts { margin-left: auto; display: flex; gap: 8px; padding-bottom: 6px; }
.reiter select, .reiter input { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 3px; padding: 5px 8px; min-width: 0; }

.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.spalte h4 { font: 600 12px var(--titel); letter-spacing: .14em; text-transform: uppercase; margin: 0 0 8px; color: var(--leise); display: flex; gap: 8px; }
.aufgabe { padding: 10px 12px; margin-bottom: 8px; }
.aufgabe .t { margin: 3px 0; overflow-wrap: anywhere; }
.aufgabe .w { font-size: 12px; color: var(--bernstein); overflow-wrap: anywhere; }
.liste .zeile { display: grid; grid-template-columns: 78px 70px 1fr 110px; gap: 12px; padding: 8px 4px; border-bottom: 1px solid var(--linie); align-items: baseline; }
.liste .zeile > :nth-child(3) { overflow-wrap: anywhere; }

.wissen-eintrag { padding: 12px 14px; margin-bottom: 8px; }
.wissen-eintrag .kopfzeile { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.wissen-eintrag .inhalt { margin-top: 6px; white-space: pre-wrap; color: var(--leise); max-height: 12em; overflow: auto; font-size: 13px; overflow-wrap: anywhere; }

.messer { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.messer .karte { padding: 14px 16px; }
.messer .wert { font: 600 30px/1.1 var(--titel); margin-top: 6px; }
.balken { height: 6px; background: var(--flaeche2); border-radius: 3px; margin-top: 10px; overflow: hidden; }
.balken > i { display: block; height: 100%; background: var(--gruen); }
/* Wofür das Geld geht (A1642): Anteil als schmaler Balken in der Zelle, vermeidbar bernsteinfarben */
.gs-zustand { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.anl-anteil { display: inline-flex; align-items: center; gap: 6px; min-width: 120px; white-space: nowrap; }
.anl-anteil > i { display: inline-block; height: 6px; max-width: 80px; background: var(--blau); border-radius: 3px; }
.anl-vermeidbar { color: var(--bernstein); border-color: var(--bernstein); }
.anl-tage { margin: 4px 0 8px; }
pre.log { background: var(--grund); border: 1px solid var(--linie); border-radius: 4px; padding: 12px; overflow: auto; max-height: 360px; font: 12px/1.5 var(--mono); color: var(--leise); }
.tab-huelle { overflow-x: auto; }
table.tab { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tab th { text-align: left; font: 11px var(--titel); letter-spacing: .12em; text-transform: uppercase; color: var(--sehrleise); padding: 6px 8px; border-bottom: 1px solid var(--linie); white-space: nowrap; }
table.tab td { padding: 7px 8px; border-bottom: 1px solid var(--linie); vertical-align: top; }

.release { display: grid; grid-template-columns: 120px 1fr; gap: 18px; padding: 14px 0; border-bottom: 1px solid var(--linie); }
.release .ver { font: 600 20px var(--titel); letter-spacing: .03em; }
.release .text { white-space: pre-wrap; color: var(--leise); margin-top: 6px; font-size: 13px; overflow-wrap: anywhere; }

.dialog-hg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 10; padding: 16px; }
.dialog { width: min(520px, 100%); padding: 22px; }
.dialog-zu { position: sticky; top: -12px; display: block; justify-self: end; z-index: 2; margin: -10px -10px -26px auto; width: 36px; height: 36px; flex: none;
  border: 1px solid var(--linie); border-radius: 50%; background: var(--flaeche); color: inherit; font-size: 18px;
  line-height: 1; cursor: pointer; } .dialog-zu:hover { border-color: var(--leise); }
.dialog-zu + h3 { padding-right: 40px; }
.dialog h3 { font: 600 20px var(--titel); margin: 0 0 10px; color: var(--rot); letter-spacing: .06em; }
.dialog.einst h3 { color: var(--tinte); }   /* Profil ist keine Warnung */
.dialog select { width: 100%; padding: 8px; background: var(--grund); border: 1px solid var(--linie); border-radius: 3px; }
.neu-laden { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px);
  z-index: 30; display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-color: var(--rot); }
.toast { position: fixed; bottom: 18px; right: 18px; left: auto; padding: 10px 14px; z-index: 20; animation: auf .3s both; }

/* --- Handy ---------------------------------------------------------------------------------
   Unten eine Leiste mit den Bereichen (Daumen), oben nur Marke, Zustand und Halt; Suche als eigene Zeile.
   Tippflächen mindestens 44 px, Fragen in voller Breite. */
@media (max-width: 760px) {
  body { font-size: 15px; }
  .rahmen { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; }
  header, nav, main { min-width: 0; }
  header { flex-wrap: wrap; gap: 8px 10px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); }
  .marke { width: auto; height: auto; border-right: 0; padding-left: 0; }
  .marke span { display: none; }
  .marke .logo { width: 54px; height: 34px; }
  #abmelden { flex: none; margin-left: auto; min-height: 36px; padding: 4px 12px; font-size: 12px; }   /* online: klein rechts oben (A1614) */
  #projektwahl { display: none; }
  .projekt-chip { display: inline-flex; align-items: center; gap: 7px; max-width: 46vw; min-height: 36px; padding: 4px 11px; border: 1px solid var(--linie2);
    border-radius: 18px; background: var(--flaeche); color: var(--tinte); font: 600 13px var(--titel); letter-spacing: .03em; cursor: pointer; }
  .projekt-chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dialog-hg.pw-hg { background: rgba(0,0,0,.55); }
  .pw-liste { left: 0 !important; right: 0; top: auto !important; bottom: 0; width: auto; max-width: none; border-radius: 16px 16px 0 0;
    padding: 10px 12px max(18px, env(safe-area-inset-bottom)); }
  .pw-liste h3 { display: block; font: 11px var(--titel); letter-spacing: .12em; text-transform: uppercase; color: var(--sehrleise); margin: 4px 10px 8px; }
  .signale { order: 2; flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; overflow: hidden; }
  .signale .signal { padding: 3px 7px; font-size: 11px; }
  .signale .signal.unwichtig { display: none; }
  .suche { order: 3; flex: 1 0 100%; margin: 0; }
  .suche input { width: 100%; padding: 10px 12px 10px 30px; }
  .suche::before { top: 8px; }
  nav { grid-row: 4; flex-direction: row; justify-content: space-around; border-right: 0; border-top: 1px solid var(--linie);
    padding: 4px 4px max(4px, env(safe-area-inset-bottom)); background: var(--flaeche); overflow-x: auto; gap: 0; }
  nav .gruppe, nav .fuss { display: none; }
  .einst .feld { grid-template-columns: minmax(0, 1fr); }
  .einst .feld > label { padding-top: 0; }
  nav a.im-mehr { display: none !important; }
  nav a.nur-handy { display: flex; }
  nav a { flex: 1 1 0; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; min-width: 0; border-left: 0; border-top: 2px solid transparent;
    font-size: 10.5px; letter-spacing: .02em; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav a [data-t-lang] { display: none; }
  nav a [data-t-kurz] { display: block !important; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  nav a .sym { display: block; font-size: 18px; line-height: 1.1; }
  nav a.an { border-top-color: var(--bernstein); background: none; }
  nav a .zahl { position: absolute; top: 2px; right: 6px; margin: 0; font-size: 10px; }
  nav a .zahl:not(.heiss) { display: none; }
  main { padding: 16px 14px 24px; }
  .ae-raster { grid-template-columns: minmax(0, 1fr); }
  .ae-wahl { display: flex; flex-wrap: wrap; } .ae-wahl > button { width: auto; flex: 1 1 30%; border-right: 1px solid var(--linie); } .ae-wahl > button .tm-fach { display: none; } .ae-neu { flex: 1 1 100%; }
  .tm-schalter { margin-top: -34px; }
  .tm-knoten.tm-lead { grid-template-columns: minmax(0, 1fr); } .tm-rechts { flex-direction: row; align-items: center; justify-content: space-between; }
  .tm-ebene { grid-template-columns: 1fr 1fr; gap: 8px; row-gap: 22px; }
  /* Liste am Handy: Name und ⋯ in der ersten Zeile, darunter Zustand, Aufgabe (zwei Zeilen), „wartet auf“ */
  .tm-z { grid-template-columns: minmax(0, 1fr) 36px; gap: 2px 10px; padding: 8px 10px; } .tm-z.tm-kopfz { display: none; }
  .tm-z > :nth-child(2), .tm-z > :nth-child(6) { display: none; }
  .tm-z > .mehr-knopf { grid-column: 2; grid-row: 1; }
  .tm-z > .tm-zustand, .tm-z > .tm-auf, .tm-z > .tm-neben { grid-column: 1 / -1; }
  .tm-z > .tm-auf { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tm-z > span:empty { display: none; }
  .leitstand { grid-template-columns: 1fr 1fr; }
  .leitstand > div:nth-child(2n) { border-right: 0; } .leitstand > div:nth-child(-n+2) { border-bottom: 1px solid var(--linie); }
  .menue button { padding: 12px 14px; }
  /* Handy: jedes Untermenü im Seitenkopf einzeilig, waagrecht wischbar – der feste Kopf bleibt flach */
  .seitenkopf.mit-menue { margin: -16px -14px 12px; padding: 16px 14px 0; }
  .seitenkopf .reiter-zeile { display: flex; gap: 2px; flex: 1 1 100%; min-width: 0; align-items: flex-end; }   /* Reiter eine Zeile, ihr Filter (.rechts) bleibt darunter stehen */
  .seitenkopf :is(.reiter-zeile, .vl-filter, .dk-arten, .dk-filter, .sprung) { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; }
  .seitenkopf :is(.reiter-zeile, .vl-filter, .dk-arten, .dk-filter, .sprung)::-webkit-scrollbar { display: none; }
  .seitenkopf .weiter-r { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); }
  .seitenkopf .weiter-l { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to left, #000 calc(100% - 36px), transparent); }
  .seitenkopf .weiter-l.weiter-r { -webkit-mask-image: linear-gradient(to right, transparent, #000 36px, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to right, transparent, #000 36px, #000 calc(100% - 36px), transparent); }
  .seitenkopf :is(.reiter-zeile, .vl-filter, .dk-arten, .dk-filter, .sprung) > * { flex: none; }
  .seitenkopf .dk-filter input { flex: none; width: 160px; }
  .seitenkopf .dk-filter select, .seitenkopf .vl-filter select { flex: none; max-width: 180px; }
  .seitenkopf .sprung { gap: 16px; white-space: nowrap; }
  h1 { font-size: 24px; }
  .wartet, .agenten { grid-template-columns: 1fr 1fr; gap: 8px; }
  .wartet { grid-template-columns: 1fr; }
  .kachel { padding: 12px; } .kachel .name { font-size: 21px; } .kachel .info { min-height: 0; }
  .dialog.agent-dialog { width: 100%; padding: 16px; }
  .frage { padding: 14px; } .frage h3 { font-size: 18px; }
  .option { min-height: 52px; padding: 12px; grid-template-columns: 26px 1fr; }
  .option .etikett { grid-column: 2; justify-self: start; }
  .knopf { min-height: 46px; flex: 1 1 auto; }
  textarea { font-size: 16px; }   /* iOS zoomt sonst beim Tippen */
  .board { grid-template-columns: 1fr; }
  .reiter { flex-wrap: wrap; }
  .reiter button { padding: 8px 10px; }
  .reiter .rechts { margin-left: 0; flex: 1 0 100%; padding: 8px 0; }
  .reiter .rechts input { flex: 1; }
  .liste .zeile { grid-template-columns: 70px 1fr; gap: 2px 10px; }
  .liste .zeile > :nth-child(2) { justify-self: end; }
  .liste .zeile > :nth-child(3) { grid-column: 1 / -1; }
  .liste .zeile > :nth-child(4) { grid-column: 1 / -1; }
  .release { grid-template-columns: 1fr; gap: 6px; }
  .vor-eintrag { grid-template-columns: 1fr; gap: 2px; }
  .toast { left: 12px; right: 12px; bottom: 80px; }
  .neuer-stand { left: 12px; right: 12px; bottom: 80px; transform: none; max-width: none; justify-content: space-between; }
}
</style>
</head>
<body>
<div class="rahmen">
  <header>
    <div class="marke"><svg class="logo" viewBox="-2 -3 50 31" role="img" aria-label="AMW"><defs><linearGradient id="amw-logo-v" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="48" y2="0"><stop offset="0" style="stop-color:var(--bernstein)"/><stop offset=".5" style="stop-color:var(--glut)"/><stop offset="1" style="stop-color:var(--blau)"/></linearGradient></defs><path d="M2 24 L8 3 L14 24 L18.5 3 L23 15 L27.5 3 L32 24 L36.5 13 L41 24 L45.5 3" stroke="url(#amw-logo-v)" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" fill="none"/><path d="M4.6 16.6 H11.4" stroke="url(#amw-logo-v)" stroke-width="2.6" stroke-linecap="round"/><circle cx="2" cy="24" r="2.5" style="fill:var(--grund);stroke:var(--bernstein)" stroke-width="1.8"/><circle cx="45.5" cy="3" r="2.5" style="fill:var(--grund);stroke:var(--blau)" stroke-width="1.8"/><circle cx="23" cy="15" r="5.4" style="fill:var(--glut);opacity:.22"/><circle cx="23" cy="15" r="3.2" style="fill:var(--glut)"/></svg><span id="marke-text"></span></div>
    <button class="projekt-chip" id="projekt-chip" type="button" hidden></button>
    <div class="signale" id="signale"></div>
    <div class="suche"><input id="suche" autocomplete="off" data-t-ph="suche"></div>
    <button class="knopf" id="abmelden" type="button" data-t="abmelden" hidden></button>
  </header>
  <nav id="nav">
    <div id="projektwahl"></div>
    <div class="gruppe" data-t="g_fuerdich"></div>
    <a data-sicht="start"><span class="sym">◉</span><span data-t="n_start"></span></a>
    <a data-sicht="nachrichten" class="im-mehr"><span class="sym">✉</span><span data-t="n_nachrichten"></span> <span class="zahl" data-zahl="nachrichten"></span></a>
    <a data-sicht="fragen"><span class="sym">?</span><span data-t="n_fragen"></span> <span class="zahl" data-zahl="fragen"></span></a>
    <a data-sicht="teamchat" class="im-mehr"><span class="sym">⇄</span><span data-t="n_teamchat"></span></a>

/* Zahnrad „Benachrichtigungen“: Hauptschalter, Anbieter (Geheimnisse nur als „gespeichert“), Ereignisse, Ruhezeit,
   Probe je Anbieter mit Antwort der API, Versandprotokoll. */
async function pushBlock(feld, text, zahl, schalter, wert, speichern) {
  let d; try { d = await holen("/api/push"); } catch (e) { return el("div", { class: "karte" }, el("h3", {}, t("p_titel")), String(e)); }
  const c = d.einstellungen, geheim = (gespeichert) => { const x = text("", "password"); x.placeholder = gespeichert ? t("e_token_da") : ""; return x; };
  const f = {
    an: schalter(c.an), max: zahl(c.max_je_stunde, 1, 60),
    ruhe_an: schalter(c.ruhe.an), ruhe_von: text(c.ruhe.von, "time"), ruhe_bis: text(c.ruhe.bis, "time"),
    ntfy_an: schalter(c.ntfy.an), ntfy_server: text(c.ntfy.server), ntfy_topic: geheim(c.ntfy.topic_gespeichert), ntfy_token: geheim(c.ntfy.token_gespeichert),
    po_an: schalter(c.pushover.an), po_app: geheim(c.pushover.app_token_gespeichert), po_user: geheim(c.pushover.user_key_gespeichert),
    tg_an: schalter(c.telegram.an), tg_token: geheim(c.telegram.bot_token_gespeichert), tg_chat: text(c.telegram.chat_id),
  };
  const ereig = Object.fromEntries(d.ereignisse.map(e => [e, schalter(c.ereignisse[e])]));
  const knopf = el("button", { class: "knopf haupt", type: "button" }, t("speichern"));
  const sammeln = () => ({
    an: f.an.checked, max_je_stunde: wert(f.max),
    ruhe: { an: f.ruhe_an.checked, von: f.ruhe_von.value, bis: f.ruhe_bis.value },
    ntfy: { an: f.ntfy_an.checked, server: wert(f.ntfy_server), topic: f.ntfy_topic.value.trim(), token: f.ntfy_token.value.trim() },
    pushover: { an: f.po_an.checked, app_token: f.po_app.value.trim(), user_key: f.po_user.value.trim() },
    telegram: { an: f.tg_an.checked, bot_token: f.tg_token.value.trim(), chat_id: wert(f.tg_chat) },
    ereignisse: Object.fromEntries(Object.entries(ereig).map(([k, x]) => [k, x.checked])),
  });
  let stand = JSON.stringify(sammeln());
  knopf.addEventListener("click", () => { const x = sammeln(); speichern("push", x, knopf).then(ok => { if (ok) stand = JSON.stringify(x); }); });
  /* Probe: Ergebnis direkt unter dem Knopf; ungespeicherte Änderungen zuerst speichern – die Probe nimmt das Gespeicherte */
  const probe = anbieter => { const b = el("button", { class: "klein-knopf", type: "button" }, t("p_probe", { x: anbieter }));
    const aus = el("div", { class: "mono", role: "status", style: "margin-top:6px;white-space:pre-wrap" });
    b.addEventListener("click", async () => { b.disabled = true; aus.className = "sehrleise mono"; aus.textContent = t("p_probe_laeuft");
      try {
        const x = sammeln(), neu = JSON.stringify(x) !== stand;
        if (neu) { await schicken("/api/einstellungen/push", x); stand = JSON.stringify(x); }
        const r = await schicken("/api/push/probe", { anbieter }), fehler = Object.values(r.probe).find(v => v !== "ok");
        aus.className = "mono";
        aus.replaceChildren(neu ? el("div", { class: "leise" }, t("p_probe_gespeichert")) : "", ...Object.entries(r.probe).map(([a, v]) =>
          el("div", { class: v === "ok" ? "" : "rot-text" }, `${a}: ${v === "ok" ? t("p_probe_ok") : v}`)));
        toast(fehler ? `${anbieter}: ${fehler}` : `${anbieter}: ${t("p_probe_ok")}`, !!fehler);
      } catch (e) { aus.className = "rot-text mono"; aus.textContent = e.message; toast(e.message, true); }
      finally { b.disabled = false; } });
    return el("div", {}, b, aus); };
  const gruppe = (titel, felder, anbieter) => el("div", { class: "push-gruppe" }, el("h4", {}, titel),
    ...felder.map(([b, x, h]) => feld(b, x, h)), anbieter ? probe(anbieter) : null);
  const protokoll = d.protokoll.length ? el("table", { class: "tab" }, el("tr", {}, ["k_zeit", "k_titel", "k_ergebnis"].map(k => el("th", {}, t(k)))),
      ...d.protokoll.slice(0, 12).map(p => el("tr", {}, el("td", {}, zeit(p.geaendert_utc)), el("td", {}, p.titel),
        el("td", { class: p.ergebnis === "gesendet" ? "" : "rot-text" }, p.ergebnis + (p.fehler ? ` – ${p.fehler}` : "")))))
    : el("div", { class: "sehrleise" }, t("p_leer"));
  return el("div", { class: "karte" }, el("h3", {}, t("p_titel"), hilfeKnopf("ntfy")), el("p", { class: "leise", style: "margin:0 0 12px" }, t("p_h", { x: c.datei })),
    feld(t("p_an"), f.an, t("p_an_h")),
    gruppe("ntfy", [[t("p_an_kurz"), f.ntfy_an], [t("p_server"), f.ntfy_server], [t("p_kanal"), f.ntfy_topic, t("p_kanal_h")], [t("p_token"), f.ntfy_token, t("p_optional")]], "ntfy"),
    gruppe("Pushover", [[t("p_an_kurz"), f.po_an], [t("p_app"), f.po_app], [t("p_user"), f.po_user]], "pushover"),
    gruppe("Telegram", [[t("p_an_kurz"), f.tg_an], [t("p_bot"), f.tg_token], [t("p_chat"), f.tg_chat, t("p_chat_h")]], "telegram"),
    gruppe(t("p_ereignisse"), d.ereignisse.map(e => [t("pe_" + e), ereig[e]])),
    gruppe(t("p_ruhe"), [[t("p_an_kurz"), f.ruhe_an, t("p_ruhe_h")], [t("p_von"), f.ruhe_von], [t("p_bis"), f.ruhe_bis], [t("p_max"), f.max]]),
    el("div", { style: "margin-top:12px" }, knopf),
    el("h4", { style: "margin-top:18px" }, t("p_protokoll")), el("div", { style: "overflow-x:auto" }, protokoll));
}
