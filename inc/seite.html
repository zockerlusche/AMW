<style>
:root {
  --grund: #13120e; --flaeche: #1c1a15; --flaeche2: #24211b; --linie: #353026; --linie2: #4a4335;
  --tinte: #ece5d3; --leise: #a39a86; --sehrleise: #6f6858;
  --bernstein: #f0a93a; --bernstein-weich: rgba(240,169,58,.12);
  --gruen: #86b46f; --rot: #e5583a; --rot-weich: rgba(229,88,58,.14); --blau: #6fa3c8; --glut: #e8743b;
  --projekt-farbe: var(--bernstein);
  --schatten: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 30px -18px rgba(0,0,0,.8);
  --titel: "Bahnschrift", "DIN Alternate", "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  --text: "Segoe UI Variable Text", "Segoe UI", "Source Sans 3", -apple-system, "Roboto", sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", "JetBrains Mono", "SF Mono", Consolas, monospace;
}
:root[data-thema="hell"] {
  --grund: #efe9da; --flaeche: #f8f4ea; --flaeche2: #f1ebdc; --linie: #d8cfba; --linie2: #c4b99f;
  --tinte: #211e17; --leise: #6b6250; --sehrleise: #9a907b;
  --bernstein: #b46d07; --bernstein-weich: rgba(180,109,7,.10);
  --gruen: #4c7d36; --rot: #b8381c; --rot-weich: rgba(184,56,28,.10); --blau: #2f6f9a; --glut: #c4501f;
  --schatten: 0 10px 24px -18px rgba(60,45,10,.45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--grund); color: var(--tinte); font: 14px/1.45 var(--text);
  background-image:
    repeating-linear-gradient(0deg, transparent 0 31px, rgba(255,255,255,.018) 31px 32px),
    radial-gradient(1200px 500px at 85% -10%, var(--bernstein-weich), transparent 60%);
}
:root[data-thema="hell"] body { background-image: repeating-linear-gradient(0deg, transparent 0 31px, rgba(0,0,0,.03) 31px 32px); }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: 12.5px; letter-spacing: -.01em; }
.leise { color: var(--leise); }
.sehrleise { color: var(--sehrleise); }

/* --- Rahmen ------------------------------------------------------------------------------- */
.rahmen { display: grid; grid-template-columns: 216px 1fr; grid-template-rows: 58px 1fr; height: 100vh; height: 100dvh; }
header {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding: 0 18px 0 0;
  border-bottom: 1px solid var(--linie); background: color-mix(in srgb, var(--grund) 85%, transparent);
  backdrop-filter: blur(6px); position: relative; z-index: 2;
}
header::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--projekt-farbe); }
.marke { width: 216px; height: 100%; display: flex; align-items: center; gap: 10px; padding-left: 18px; border-right: 1px solid var(--linie); flex: none; }
.marke .logo { width: 66px; height: 41px; flex: none; }   /* Logo A·M·W als Neuronenzug (F5229) */
.marke span { font: 10px/1.2 var(--titel); letter-spacing: .06em; color: var(--sehrleise); text-transform: uppercase; }
.marke span i { font-style: normal; font-weight: 600; color: var(--tinte); }
.signale { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.signal { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border: 1px solid var(--linie);
  border-radius: 3px; font: 12px var(--titel); letter-spacing: .05em; text-transform: uppercase; color: var(--leise); background: var(--flaeche); white-space: nowrap; }
.punkt { width: 8px; height: 8px; border-radius: 50%; background: var(--sehrleise); flex: none; }
.punkt.gruen { background: var(--gruen); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gruen) 20%, transparent); }
.punkt.bernstein { background: var(--bernstein); box-shadow: 0 0 0 3px var(--bernstein-weich); }
.punkt.rot { background: var(--rot); box-shadow: 0 0 0 3px var(--rot-weich); animation: puls 1.6s infinite; }
@keyframes puls { 50% { opacity: .35; } }
.suche { margin-left: auto; position: relative; }
.suche input { width: min(34vw, 380px); padding: 8px 12px 8px 30px; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 3px; outline: none; }
.suche input:focus { border-color: var(--bernstein); }
.suche::before { content: "⌕"; position: absolute; left: 10px; top: 6px; color: var(--sehrleise); font-size: 16px; }
.schalter-halt { font: 600 13px var(--titel); letter-spacing: .12em; text-transform: uppercase; padding: 9px 16px; border-radius: 3px;
  border: 1px solid var(--rot); background: transparent; color: var(--rot); cursor: pointer; flex: none; }
.schalter-halt:hover { background: var(--rot-weich); }
.schalter-halt.aktiv { background: var(--rot); color: #fff; }

nav { border-right: 1px solid var(--linie); padding: 14px 0; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
nav .gruppe { font: 11px var(--titel); letter-spacing: .14em; text-transform: uppercase; color: var(--sehrleise); padding: 14px 18px 6px; }
nav a { display: flex; align-items: baseline; gap: 10px; padding: 8px 18px; color: var(--leise); text-decoration: none; cursor: pointer;
  border-left: 3px solid transparent; font: 15px var(--titel); letter-spacing: .02em; }
nav a .sym { display: none; }
nav a.nur-handy { display: none; }
.mehr-liste { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mehr-liste button { display: grid; justify-items: center; gap: 4px; padding: 12px 4px; min-height: 72px; border: 1px solid var(--linie);
  border-radius: 8px; background: var(--grund); color: var(--tinte); font: 13px var(--titel); cursor: pointer; position: relative; }
.mehr-liste button.an { border-color: var(--bernstein); color: var(--bernstein); }
.mehr-liste .sym { font-size: 20px; line-height: 1; }
.mehr-liste .zahl { position: absolute; top: 6px; right: 8px; font: 11px var(--mono); color: var(--sehrleise); }
.mehr-fuss { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
.mehr-fuss .version { margin-left: auto; font: 11px var(--mono); color: var(--sehrleise); }
nav a:hover { color: var(--tinte); background: var(--flaeche); }
nav a.an { color: var(--tinte); border-left-color: var(--bernstein); background: linear-gradient(90deg, var(--bernstein-weich), transparent); }
nav a .zahl { margin-left: auto; font: 12px var(--mono); color: var(--sehrleise); }
nav a .zahl.heiss { color: #1b1408; background: var(--bernstein); padding: 0 7px; border-radius: 9px; font-weight: 600; }
nav .fuss { margin-top: auto; padding: 14px 18px; display: flex; gap: 8px; flex-wrap: wrap; }
/* Projekt-Auswahl: oben in der Navigation, am Handy als Chip im Kopf (doc/plan-projektwahl.md) */
.pw { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 9px; align-items: center; width: calc(100% - 24px); margin: 0 12px 6px; padding: 7px 10px;
  border: 1px solid var(--linie2); border-radius: 3px; background: var(--flaeche); color: var(--tinte); cursor: pointer; text-align: left; font: inherit; }
.pw:hover, .pw:focus-visible { border-color: var(--leise); }
.pw-farbe { width: 10px; height: 10px; border-radius: 2px; background: var(--projekt-farbe); flex: none; }
.pw-klein { display: block; font: 10px var(--titel); letter-spacing: .12em; text-transform: uppercase; color: var(--sehrleise); }
.pw-name { display: block; font: 600 15px var(--titel); letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pw-pfeil { color: var(--leise); font-size: 12px; }
.pw.still { cursor: default; } .pw.still .pw-pfeil { display: none; }
.projekt-chip { display: none; }
.dialog-hg.pw-hg { background: transparent; display: block; padding: 0; }
.pw-liste { position: absolute; width: 310px; max-width: calc(100vw - 24px); border: 1px solid var(--linie2); background: var(--flaeche2); border-radius: 4px;
  box-shadow: 0 16px 40px -10px rgba(0,0,0,.7); padding: 6px; }
.pw-liste .dialog-zu { display: none; }
.pw-liste h3 { display: none; }
.pw-eintrag { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 9px 10px; border: 0;
  border-radius: 3px; background: none; color: var(--tinte); text-align: left; font: inherit; cursor: pointer; min-height: 48px; }
.pw-eintrag:hover, .pw-eintrag:focus-visible { background: var(--flaeche); }
.pw-eintrag.an { background: var(--bernstein-weich); }
.pw-eintrag b { font: 600 15px var(--titel); letter-spacing: .03em; }
.pw-eintrag small { display: block; color: var(--leise); font-size: 12px; }
.pw-zahl { font: 600 12px var(--titel); color: var(--bernstein); white-space: nowrap; }
.pw-fuss { border-top: 1px solid var(--linie); margin-top: 6px; padding: 8px 10px 4px; display: grid; gap: 4px; }
.pc-marke { display: inline-block; font: 10.5px var(--titel); letter-spacing: .08em; text-transform: uppercase; padding: 1px 6px; border: 1px solid var(--blau);
  border-radius: 2px; color: var(--blau); vertical-align: middle; }
.signal .pcz { font-size: 10px; color: var(--blau); border-left: 1px solid var(--linie2); padding-left: 6px; }
tr.fremd td { color: var(--sehrleise); font-style: italic; }
.klein-knopf { font: 12px var(--titel); letter-spacing: .06em; text-transform: uppercase; padding: 6px 10px; border: 1px solid var(--linie2);
  background: transparent; border-radius: 3px; cursor: pointer; color: var(--leise); }
.klein-knopf:hover { color: var(--tinte); border-color: var(--leise); }

main { overflow-y: auto; padding: 26px 30px 60px; }
.kopf { display: flex; align-items: baseline; gap: 14px; margin: 0 0 18px; flex-wrap: wrap; }
h1 { font: 600 28px/1.1 var(--titel); letter-spacing: .03em; margin: 0; }
h2 { font: 600 13px var(--titel); letter-spacing: .16em; text-transform: uppercase; color: var(--leise); margin: 30px 0 12px;
  display: flex; align-items: center; gap: 10px; }
h2::after { content: ""; flex: 1; height: 1px; background: var(--linie); }
.zeile-reveal > * { animation: auf .45s cubic-bezier(.2,.7,.2,1) both; }
.zeile-reveal > *:nth-child(2) { animation-delay: .04s } .zeile-reveal > *:nth-child(3) { animation-delay: .08s }
.zeile-reveal > *:nth-child(4) { animation-delay: .12s } .zeile-reveal > *:nth-child(5) { animation-delay: .16s }
.zeile-reveal > *:nth-child(n+6) { animation-delay: .2s }
.still .zeile-reveal > * { animation: none; }
nav .fuss .version { width: 100%; font: 11px var(--mono); color: var(--sehrleise); letter-spacing: 0; }
.einst { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; max-width: 980px; }
.einst > * { min-width: 0; }   /* sonst zieht die breite Agenten-Tabelle alle Karten über den Handy-Rand */
.einst .karte { padding: 16px 18px; }
.einst h3, .dialog > h3 { font: 600 15px var(--titel); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 10px; }
.einst .feld { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 6px 14px; align-items: start; padding: 5px 0; }
.einst .feld > label { color: var(--leise); font-size: 13px; padding-top: 7px; }
.einst input:not([type=checkbox]), .einst select { width: 100%; max-width: 420px; padding: 7px 9px; background: var(--grund); color: var(--tinte);
  border: 1px solid var(--linie); border-radius: 3px; font: inherit; font-size: 14px; }
.einst input[type=checkbox] { width: 18px; height: 18px; margin-top: 8px; accent-color: var(--bernstein); }
.einst table.tab input:not([type=checkbox]), .einst table.tab select { min-width: 70px; }
.einst table.tab td { vertical-align: middle; }
.einst .gesperrt { opacity: .65; }
@keyframes auf { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* --- Bausteine ---------------------------------------------------------------------------- */
.karte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 4px; box-shadow: var(--schatten); }
.ref { font: 12.5px var(--mono); color: var(--bernstein); }
.etikett { display: inline-block; font: 11px var(--titel); letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px;
  border: 1px solid var(--linie2); border-radius: 2px; color: var(--leise); white-space: nowrap; }
.etikett.rot { border-color: var(--rot); color: var(--rot); }
.etikett.bernstein { border-color: var(--bernstein); color: var(--bernstein); }
.etikett.gruen { border-color: var(--gruen); color: var(--gruen); }
.ki-kopf { margin: 18px 0 8px; font-size: 14px; }
.dk-prompt { margin-top: 6px; padding: 6px 8px; border-left: 2px solid var(--linie); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 9em; overflow: auto; }
.leer { padding: 22px; color: var(--sehrleise); border: 1px dashed var(--linie); border-radius: 4px; text-align: center; }

.band-halt { display: flex; gap: 14px; align-items: center; padding: 14px 18px; border: 1px solid var(--rot); background: var(--rot-weich);
  border-radius: 4px; margin-bottom: 18px; flex-wrap: wrap; }
.band-halt b { font: 600 18px var(--titel); letter-spacing: .1em; color: var(--rot); }
.band-warn { display: grid; gap: 4px; padding: 12px 18px; border: 1px solid var(--bernstein); background: var(--bernstein-weich);
  border-radius: 4px; margin-bottom: 18px; }
.band-warn b { font: 600 14px var(--titel); letter-spacing: .1em; color: var(--bernstein); }
/* Schirm-Schalter: frei = Agenten dürfen Fenster öffnen – auffällig; zu mit wartenden Läufen – ruhig */
.band-schirm { display: flex; gap: 14px; align-items: center; padding: 12px 18px; border: 1px solid var(--linie); background: var(--flaeche);
  border-radius: 4px; margin-bottom: 18px; flex-wrap: wrap; }
.band-schirm.frei { border-color: var(--bernstein); background: var(--bernstein-weich); }
.band-schirm b { font: 600 15px var(--titel); letter-spacing: .1em; }
.band-schirm.frei b { color: var(--bernstein); }
.band-schirm > div { flex: 1 1 320px; }
.band-schirm .knopf { margin-left: auto; }
.signal.knopflich { cursor: pointer; }
.signal.knopflich:hover { border-color: var(--leise); }
.kurztext { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.kurztext.auf { display: block; -webkit-line-clamp: unset; }
.mehr { font: 12px var(--titel); letter-spacing: .06em; color: var(--sehrleise); cursor: pointer; background: none; border: 0; padding: 4px 0 0; }
.nachtrag-neu { margin-left: 8px; }
/* Planung: senkrechte Zeitleiste */
.zeitleiste { position: relative; display: grid; gap: 14px; padding-left: 26px; margin-top: 8px; }
.zeitleiste::before { content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px; background: var(--linie2); }
.tl-heute { position: relative; margin: 2px 0 -4px -26px; display: flex; align-items: center; gap: 8px; }
.tl-heute::before { content: ""; width: 18px; height: 2px; background: var(--bernstein); }
.tl-heute span { font: 12px var(--titel); letter-spacing: .12em; text-transform: uppercase; color: var(--bernstein); }
.tl-heute::after { content: ""; flex: 1; height: 1px; background: color-mix(in srgb, var(--bernstein) 50%, transparent); }
.tl-bogen { position: relative; padding: 14px 16px; display: grid; gap: 6px; }
.tl-bogen.status-fertig { opacity: .75; } .tl-bogen.status-verworfen { opacity: .45; }
.tl-punkt { position: absolute; left: -24px; top: 18px; width: 12px; height: 12px; border-radius: 50%; background: var(--sehrleise); border: 2px solid var(--grund); }
.tl-punkt.gruen { background: var(--gruen); } .tl-punkt.bernstein { background: var(--bernstein); } .tl-punkt.rot { background: var(--rot); }
.tl-kopf { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tl-titel { font: 600 18px var(--titel); letter-spacing: .02em; }
.tl-knoepfe { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.tl-zeile { font-size: 14px; overflow-wrap: anywhere; }
.tl-fortschritt { display: grid; grid-template-columns: minmax(80px, 260px) auto; gap: 10px; align-items: center; }
.tl-daten { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13.5px; }
.tl-specs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spec-chip { font: 12px var(--titel); letter-spacing: .04em; padding: 3px 9px; border-radius: 12px; border: 1px solid var(--linie2); background: var(--grund); color: var(--leise); cursor: pointer; }
.spec-chip.spec-frei { border-color: var(--gruen); color: var(--gruen); }
.spec-chip.spec-vorgelegt { border-color: var(--bernstein); color: var(--bernstein); font-weight: 600; }
.spec-chip.spec-zurueck { border-color: var(--rot); color: var(--rot); }
.tl-schritte summary { cursor: pointer; font: 12px var(--titel); letter-spacing: .1em; text-transform: uppercase; color: var(--leise); margin-top: 4px; }
.welle { margin-top: 8px; } .welle-kopf { font: 11px var(--titel); letter-spacing: .12em; text-transform: uppercase; color: var(--sehrleise); margin-bottom: 4px; }
.schritt { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; padding: 6px 8px;
  border-left: 3px solid var(--linie2); background: var(--grund); border-radius: 3px; margin-bottom: 4px; font-size: 13.5px; }
.schritt.status-laeuft { border-left-color: var(--gruen); } .schritt.status-fertig { opacity: .6; } .schritt.status-blockiert { border-left-color: var(--rot); }
.schritt.mensch { border-left-color: var(--bernstein); background: var(--bernstein-weich); }
.schritt-titel { overflow-wrap: anywhere; } .schritt-meta { grid-column: 2 / 4; font-size: 12px; }
.spec-text { white-space: pre-wrap; font: 13.5px/1.5 var(--mono); background: var(--grund); border: 1px solid var(--linie); border-radius: 4px; padding: 12px; max-height: 50vh; overflow: auto; }
.verweis { cursor: pointer; color: var(--bernstein); border-bottom: 1px dotted currentColor; }
.check { display: grid; gap: 6px; } .check > div { padding: 6px 0; border-bottom: 1px solid var(--linie); font-size: 14px; }
.gruen-text { color: var(--gruen); }
.rm-huelle { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
.rm { display: grid; grid-template-columns: 18px auto; grid-template-rows: auto 18px; gap: 4px; }
.rm-y { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 11px; }
.rm-x { grid-column: 2; text-align: center; font-size: 11px; }
.rm-gitter { display: grid; grid-template-columns: 16px repeat(5, 38px); gap: 3px; }
.rm-zelle { height: 30px; border-radius: 3px; display: grid; place-items: center; font: 600 13px var(--mono); color: var(--tinte); }
.rm-gruen { background: color-mix(in srgb, var(--gruen) 25%, transparent); } .rm-gelb { background: color-mix(in srgb, var(--bernstein) 30%, transparent); }
.rm-rot { background: color-mix(in srgb, var(--rot) 35%, transparent); }
.rm-achse { font-size: 11px; display: grid; place-items: center; }
.risiko { padding: 10px 14px; cursor: pointer; } .risiko.status-erledigt { opacity: .55; }
/* Plan-Check: Befunde mit Bedeutung, Abhilfe, Wer; Gruppen je Bogen */
.check-kopf { display: grid; gap: 8px; margin-bottom: 14px; }
.check-kopf p { margin: 0; font-size: 14.5px; }
.check-zahlen { display: flex; gap: 8px; flex-wrap: wrap; }
.check-zahl { border: 1px solid var(--linie2); border-radius: 3px; padding: 4px 10px; font-size: 13.5px; }
.check-zahl b { font: 600 16px var(--titel); }
.check-zahl.fehler { border-color: var(--rot); } .check-zahl.fehler b { color: var(--rot); }

table.tab td { padding: 7px 8px; border-bottom: 1px solid var(--linie); vertical-align: top; }

.release { display: grid; grid-template-columns: 120px 1fr; gap: 18px; padding: 14px 0; border-bottom: 1px solid var(--linie); }
.release .ver { font: 600 20px var(--titel); letter-spacing: .03em; }
.release .text { white-space: pre-wrap; color: var(--leise); margin-top: 6px; font-size: 13px; overflow-wrap: anywhere; }

.dialog-hg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 10; padding: 16px; }
.dialog { width: min(520px, 100%); padding: 22px; }
.dialog-zu { position: sticky; top: -12px; display: block; justify-self: end; z-index: 2; margin: -10px -10px -26px auto; width: 36px; height: 36px; flex: none;
  border: 1px solid var(--linie); border-radius: 50%; background: var(--flaeche); color: inherit; font-size: 18px;
  line-height: 1; cursor: pointer; } .dialog-zu:hover { border-color: var(--leise); }
.dialog-zu + h3 { padding-right: 40px; }
.dialog h3 { font: 600 20px var(--titel); margin: 0 0 10px; color: var(--rot); letter-spacing: .06em; }
.dialog.einst h3 { color: var(--tinte); }   /* Profil ist keine Warnung */
.dialog select { width: 100%; padding: 8px; background: var(--grund); border: 1px solid var(--linie); border-radius: 3px; }
.neu-laden { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px);
  z-index: 30; display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-color: var(--rot); }
.toast { position: fixed; bottom: 18px; right: 18px; left: auto; padding: 10px 14px; z-index: 20; animation: auf .3s both; }

/* --- Handy ---------------------------------------------------------------------------------
   Unten eine Leiste mit den Bereichen (Daumen), oben nur Marke, Zustand und Halt; Suche als eigene Zeile.
   Tippflächen mindestens 44 px, Fragen in voller Breite. */
@media (max-width: 760px) {
  body { font-size: 15px; }
  .rahmen { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; }
  header, nav, main { min-width: 0; }
  header { flex-wrap: wrap; gap: 8px 10px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); }
  .marke { width: auto; height: auto; border-right: 0; padding-left: 0; }
  .marke span { display: none; }
  .marke .logo { width: 54px; height: 34px; }
  #projektwahl { display: none; }
  .projekt-chip { display: inline-flex; align-items: center; gap: 7px; max-width: 46vw; min-height: 36px; padding: 4px 11px; border: 1px solid var(--linie2);
    border-radius: 18px; background: var(--flaeche); color: var(--tinte); font: 600 13px var(--titel); letter-spacing: .03em; cursor: pointer; }
  .projekt-chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dialog-hg.pw-hg { background: rgba(0,0,0,.55); }
  .pw-liste { left: 0 !important; right: 0; top: auto !important; bottom: 0; width: auto; max-width: none; border-radius: 16px 16px 0 0;
    padding: 10px 12px max(18px, env(safe-area-inset-bottom)); }
  .pw-liste h3 { display: block; font: 11px var(--titel); letter-spacing: .12em; text-transform: uppercase; color: var(--sehrleise); margin: 4px 10px 8px; }
  .signale { order: 2; flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; overflow: hidden; }
  .signale .signal { padding: 3px 7px; font-size: 11px; }
  .signale .signal.unwichtig { display: none; }
  .schalter-halt { margin-left: auto; padding: 8px 14px; min-height: 40px; }
  .suche { order: 3; flex: 1 0 100%; margin: 0; }
  .suche input { width: 100%; padding: 10px 12px 10px 30px; }
  .suche::before { top: 8px; }
  nav { grid-row: 4; flex-direction: row; justify-content: space-around; border-right: 0; border-top: 1px solid var(--linie);
    padding: 4px 4px max(4px, env(safe-area-inset-bottom)); background: var(--flaeche); overflow-x: auto; gap: 0; }
  nav .gruppe, nav .fuss { display: none; }
  .einst .feld { grid-template-columns: minmax(0, 1fr); }

  nav a.nur-handy { display: flex; }
  nav a { flex: 1 1 0; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; min-width: 0; border-left: 0; border-top: 2px solid transparent;

  nav a [data-t-lang] { display: none; }
  nav a [data-t-kurz] { display: block !important; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  nav a .sym { display: block; font-size: 18px; line-height: 1.1; }
  nav a.an { border-top-color: var(--bernstein); background: none; }
  nav a .zahl { position: absolute; top: 2px; right: 6px; margin: 0; font-size: 10px; }
  nav a .zahl:not(.heiss) { display: none; }
  main { padding: 16px 14px 24px; }
  h1 { font-size: 24px; }
  .wartet, .agenten { grid-template-columns: 1fr 1fr; gap: 8px; }
  .wartet { grid-template-columns: 1fr; }
  .kachel { padding: 12px; } .kachel .name { font-size: 21px; } .kachel .info { min-height: 0; }
  .dialog.agent-dialog { width: 100%; padding: 16px; }
  .frage { padding: 14px; } .frage h3 { font-size: 18px; }
  .option { min-height: 52px; padding: 12px; grid-template-columns: 26px 1fr; }
  .option .etikett { grid-column: 2; justify-self: start; }
  .knopf { min-height: 46px; flex: 1 1 auto; }
  textarea { font-size: 16px; }   /* iOS zoomt sonst beim Tippen */
  .board { grid-template-columns: 1fr; }
  .reiter { flex-wrap: wrap; }
  .reiter button { padding: 8px 10px; }
  .reiter .rechts { margin-left: 0; flex: 1 0 100%; padding: 8px 0; }
  .reiter .rechts input { flex: 1; }
  .liste .zeile { grid-template-columns: 70px 1fr; gap: 2px 10px; }
  .liste .zeile > :nth-child(2) { justify-self: end; }

  .liste .zeile > :nth-child(4) { grid-column: 1 / -1; }

  .vor-eintrag { grid-template-columns: 1fr; gap: 2px; }
  .toast { left: 12px; right: 12px; bottom: 80px; }
  .neuer-stand { left: 12px; right: 12px; bottom: 80px; transform: none; max-width: none; justify-content: space-between; }
}

    pw_neu: "Neues Projekt", pw_neu_pc: "Neue Projekte legst du am PC an.",
    npa_link: "Anleitung", npa_titel: "Neues Projekt – Schritt für Schritt",
    npa_intro: "Ein Projekt ist für sich: eigene Agenten, Regeln, Aufgaben und Dokumente. Von Hand legst du nur den Projektordner an – alles andere macht die AMW.",
    npa_online: "Anlegen geht nur am PC (Workbench auf dem Rechner, auf dem die AMW läuft). Hier kannst du die Schritte lesen.",
    npa_s1_t: "Projektordner anlegen", npa_s1: "Im Explorer, z. B. F:\\webshop. Darin arbeiten die Agenten (meist das Repository). Ein Ordner gehört zu genau einem Projekt.",
    npa_s2_t: "„+ Neues Projekt“ öffnen", npa_s2: "Workbench am PC › oben in der Navigation die Projekt-Auswahl › „+ Neues Projekt“ (auch unter Einstellungen › Projekt).",
    npa_s3_t: "Ausfüllen und anlegen", npa_s3: "Name, Projektordner, Lead (leer, wenn du selbst leitest), Agenten, Rechte, Arbeitsregeln (ohne oder einmalige Kopie eines anderen Projekts) und Farbe. „Anlegen“ richtet den Ordner ein (Hooks, Projekt-Kennung, amw-Befehl ohne Rückfrage), legt Lead und Agenten mit Profil und Startsatz an und schreibt ein eigenes Startskript.",
    npa_s4_t: "Vor dem ersten Start: Leitbild und erste Aufgabe", npa_s4: "„Zum Projekt“ › Planung › Leitbild: Ziel, Nicht-Ziele, Prinzipien. Dann eine erste Aufgabe (Arbeit) oder einen Bogen (Planung) – sonst findet der Agent nichts zu tun. Projektwissen (Technik, Build, Stil) schreibst du in eine CLAUDE.md im Projektordner; die legt die AMW nicht an.",
    npa_s5_t: "Agent starten", npa_s5: "Start › Kachel des Agenten › „Starten“. Es öffnet sich ein Tab „CC1 · Projektname“. Beim allerersten Start in einem neuen Ordner fragt Claude Code einmal, ob du dem Ordner vertraust – im Tab mit „Yes, proceed“ bestätigen; vorher läuft nichts an. Danach steht im Fenster „AMW: als CC1 angemeldet“.",
    npa_s6_t: "Erste Nachricht", npa_s6: "Der Agent liest Regeln und Nachrichten, holt seine Arbeit und meldet sich. Seine Nachrichten siehst du unter Start, im Verlauf und in der Kachel (Gespräch).",
    npa_w_t: "Woher weiß der erste Agent alles?",
    npa_w1: "Startsatz – der erste Satz jeder neuen Sitzung, im Profil des Agenten (Kachel › Profil, dort änderbar): wer er ist, wie er die AMW aufruft und womit er anfängt (Lead: planen und verteilen, Agent: Arbeit holen).",
    npa_w2: "Pflicht-Kontext – bei jedem Start, Fortsetzen und Verdichten gibt der Start-Hook ihm: Befehl und Kurzanleitung, Ziel, Nicht-Ziele und Prinzipien aus dem Leitbild, aktive Bögen, seine Aufgabenliste, offene Nachrichten und Regeln.",
    npa_w3: "Projektwissen – deine CLAUDE.md im Projektordner liest Claude Code selbst.",
    npa_f_t: "Häufige Fragen",
    npa_f1_q: "Braucht ein neues Projekt MCP?", npa_f1: "Nein. Agenten arbeiten über die Hooks und den amw-Befehl; beides richtet „Anlegen“ im Projektordner ein. Nur ein Lead ohne direkten Zugriff (z. B. in Cowork oder einer VM) nutzt die Datei-Brücke: Einstellungen › Dieser PC › Brücke an; Befehle in eingang-<projekt>\\befehle im AMW-Ordner, Lese-Kopie daten\\lesen-<projekt>.db – dafür muss der AMW-Ordner in der Desktop-App verbunden sein.",
    npa_f2_q: "Muss ich den Wächter kopieren?", npa_f2: "Nein. Ein Wächter je PC weckt die Agenten jedes Projekts für sich. Keine zweite AMW-Installation anlegen.",
    npa_f3_q: "Was lege ich von Hand an?", npa_f3: "Nur den Projektordner (und, wenn du willst, eine CLAUDE.md darin). Projekt, Agenten, Profile, Hooks und Startskript legt die AMW an.",
    npa_f4_q: "Brauche ich ein Git-Repository?", npa_f4: "Für die AMW nicht. Für Code empfohlen: Aufgaben schließt ein Agent mit einem Beleg ab – Commit, Datei:Zeile oder Folgeaufgabe.",
    npa_f5_q: "Wo liegen die Claude-Code-Sitzungen?", npa_f5: "Die Agenten arbeiten im Projektordner. Claude Code legt den Verlauf in deinem Benutzerordner unter .claude\\projects ab, je Ordner. In der Workbench: Kachel › Gespräch.",
    npa_f6_q: "Dürfen die Agenten wie im anderen Projekt heißen?", npa_f6: "Ja, CC1 darf es in jedem Projekt geben. Der Tab heißt dann „CC1 · Projektname“; jede Sitzung meldet sich nur in ihrem Projekt an.",
    npa_f7_q: "Projekt auf einen anderen Rechner?", npa_f7: "amw sichern --projekt <name> schreibt das Projekt als eigene Datenbank samt Dokumenten (Anleitung „Mehrere Projekte“ in der Doku).",

let sprache = "de";

/* Elemente nur über textContent – Inhalte aus der Datenbank werden nie als HTML gesetzt. */
function el(tag, attr, ...kinder) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attr || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kinder.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const gebiet = () => (sprache === "en" ? "en-GB" : "de-DE");
const zeit = x => { if (!x) return "–"; return new Date(x).toLocaleString(gebiet(), { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); };
function seit(x) {
  if (!x) return t("nie"); const s = (Date.now() - new Date(x)) / 1000;
  if (s < 90) return t("gerade"); if (s < 3600) return t("vor_min", { n: Math.round(s / 60) });
  if (s < 86400) return t("vor_h", { n: Math.round(s / 3600) }); return t("vor_t", { n: Math.round(s / 86400) });
}
async function holen(weg) { const r = await fetch(ziel(weg), { cache: "no-store" }); if (!r.ok) throw new Error((await r.json()).fehler || r.status); return r.json(); }
async function schicken(weg, daten) {
  const r = await fetch(ziel(weg), { method: "POST", headers: { "Content-Type": "application/json", "X-AMW-Token": TOKEN }, body: JSON.stringify(daten) });
  const j = await r.json().catch(() => ({}));
  if (j.neu_laden) { neuLadenLeiste(); throw new Error(t("neu_laden")); }
  if (!r.ok) throw new Error(j.fehler || r.status);
  if (j.unterwegs) toast(t("unterwegs"));
  nachAktion(); return j;
}
function neuLadenLeiste() {          // bleibt stehen, bis neu geladen wird – Eingaben auf der Seite bleiben bis dahin
  if (document.getElementById("neu-laden")) return;
  const k = el("button", { class: "knopf haupt", type: "button" }, t("neu_laden_knopf"));
  k.addEventListener("click", () => location.reload());
  document.body.append(el("div", { class: "karte neu-laden", id: "neu-laden", role: "alert" },
    el("span", {}, t("neu_laden")), k));
}
function toast(text, fehler) {
  if (text.includes(t("neu_laden")) && document.getElementById("neu-laden")) return;   // steht schon oben
  const x = el("div", { class: "karte toast" }, text); if (fehler) x.style.borderColor = "var(--rot)";
