# AMW – nginx-Vorlage aus „amw web paket“ ({{DATUM}})
# Online-Seite {{SEITE}} · Online-Speicher {{SPEICHER}}
#
# Anpassen vor dem Einbinden (z. B. nach /etc/nginx/conf.d/amw.conf):
#   - Zertifikat und Schlüssel der Firma (ssl_certificate …), falls https
#   - Ordner der Seite ({{WEB_ORDNER}}) und der Konfiguration ({{KONFIG}})
#   - PHP-FPM ({{PHP}}) – PHP ab 8.1 mit curl, openssl, mbstring, pdo_sqlite
# Dieselben Regeln wie web/.htaccess (Apache): nur die drei Einstiege und die Hilfe-Dateien sind erreichbar.

server {
{{LISTEN_SEITE}}
    server_name {{SEITE_HOST}};
{{TLS}}
    root {{WEB_ORDNER}};
    server_tokens off;
    client_max_body_size 4m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / {
        rewrite ^ /index.php last;
    }
    location ~ ^/(index|api|sso)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param AMW_KONFIG {{KONFIG}};
        fastcgi_pass {{PHP}};
    }
    location ~ ^/hilfe/[a-z0-9-]+\.(webp|de\.json|en\.json)$ {
        try_files $uri =404;
    }
    location / {
        return 403;
    }
}
{{SPEICHER_BLOCK}}