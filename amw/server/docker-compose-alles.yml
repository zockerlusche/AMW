# AMW – BEISPIEL: Online-Speicher, PHP und nginx zusammen in Docker. Aus „amw web paket“ ({{DATUM}}).
# Nicht Pflicht – jeder vorhandene Webserver mit PHP tut es auch (siehe LIESMICH.txt).
# Erwartet im Paket-Ordner: web/, konfig/, speicher/amw-speicher-oeffentlich.pem, beispiel/nginx-docker.conf
# und (bei https) das Zertifikat der Firma als beispiel/zertifikat/amw.crt + amw.key.
# Start im Ordner „beispiel“:  docker compose -f docker-compose-alles.yml up -d
services:
  speicher:
    image: ghcr.io/tursodatabase/libsql-server:latest   # geprüft mit sqld 0.24.32
    restart: unless-stopped
    environment:
      SQLD_NODE: primary
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
      SQLD_AUTH_JWT_KEY_FILE: /schluessel/amw-speicher-oeffentlich.pem
    volumes:
      - amw-speicher:/var/lib/sqld
      - ../speicher/amw-speicher-oeffentlich.pem:/schluessel/amw-speicher-oeffentlich.pem:ro
{{SPEICHER_PORTS}}  php:
    image: php:8.3-fpm            # bringt curl, openssl, mbstring und pdo_sqlite mit
    restart: unless-stopped
    volumes:
      - ../web:/var/www/amw/web:ro
      - ../konfig:/var/www/amw/konfig
  web:
    image: nginx:stable
    restart: unless-stopped
    depends_on: [php, speicher]
    volumes:
      - ../web:/var/www/amw/web:ro
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./zertifikat:/etc/ssl/firma:ro
    ports:
{{WEB_PORTS}}
volumes:
  amw-speicher:
