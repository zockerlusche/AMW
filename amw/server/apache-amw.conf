# AMW – Apache-Vorlage aus „amw web paket“ ({{DATUM}})
# Online-Seite {{SEITE}} · Online-Speicher {{SPEICHER}}
#
# Anpassen vor dem Einbinden (z. B. /etc/apache2/sites-available/amw.conf, dann a2ensite amw):
#   - Zertifikat und Schlüssel der Firma (SSLCertificateFile …), falls https
#   - Ordner der Seite ({{WEB_ORDNER}}) und der Konfiguration ({{KONFIG}})
# Module: rewrite, headers, php (oder proxy_fcgi für PHP-FPM){{MODULE_SPEICHER}}
#   a2enmod rewrite headers{{A2ENMOD}}
# Was erreichbar ist, regelt die .htaccess im Ordner der Seite – darum AllowOverride All.

<VirtualHost *:{{PORT_SEITE}}>
    ServerName {{SEITE_HOST}}
    DocumentRoot {{WEB_ORDNER}}
{{TLS}}
    SetEnv AMW_KONFIG {{KONFIG}}
    <Directory {{WEB_ORDNER}}>
        AllowOverride All
        Require all granted
    </Directory>
    ServerSignature Off
</VirtualHost>
{{SPEICHER_BLOCK}}